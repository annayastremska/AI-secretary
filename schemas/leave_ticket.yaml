# Схема шаблону "Відпускний квиток" (Додаток 30 до Інструкції з діловодства
# у ЗСУ, підпункт 2.8.9). Regex-паттерни й типи нормалізації тут керують
# екстракцією напряму (генеричний двигун у pipeline/extraction) — не
# продубльовані окремо в коді.
template: leave_ticket
domain: leave
fact_type: leave   # -> dictionaries/fact_type_registry.yaml (validity_model: ranged)

# ВИД СУБ'ЄКТА цього бланка. Це ОГОЛОШЕННЯ схеми, а не висновок з тексту, і
# саме тому воно старше за мапінг «домен -> вид» (pipeline/subject_kind.py).
# person: відпускний квиток -- запис про одну конкретну особу.
# Закритий перелік = рядки object_kinds у БД + "none" (суб'єкта немає).
subject_kind: person

# Як упізнати саме цей бланк -- щоб схему вибирав пайплайн, а не людина
# вручну (див. pipeline/identification.py). Фрази взяті з реального тексту
# шаблону data/samples/leave/відпускний_шаблон.docx.
identification:
  description: "Відпускний квиток (Додаток 30 до Інструкції з діловодства у ЗСУ)"
  title: ["відпускний квиток"]                  # вага 5
  anchors:                                      # вага 2 кожен
    - "додаток 30"
    - "вид відпустки та найменування населеного пункту"
    - "після закінчення строку відпустки"
    - "дата повернення"
    - "військові перевізні документи за №"
  min_score: 5

fields:
  # --- rank + ПІБ: спеціальний режим (не простий regex) ---
  # Токенізація рядка перед підписом-лейблом: найдовший префікс токенів, що
  # є відомим званням у довіднику, визначає межу; решта -- прізвище/ім'я/по
  # батькові за регістром. Той самий режим підходить і для deployment_certificate
  # (там та сама структура "звання ПІБ" перед тим самим лейблом).
  - name: rank
    # part: РОЛЬ поля в розборі рядка "звання ПІБ". Саме вона, а не ім'я
    # поля, керує морфологією й ключем у subject -- тому схема може
    # називати поля як завгодно (applicant_surname, prizvyshche).
    part: rank
    type: category
    category: military_rank
    extraction: rank_and_name_tokenized
    label_before: "військове звання, прізвище, ім"
    db_target: person

  - name: surname
    # part: РОЛЬ поля в розборі рядка "звання ПІБ". Саме вона, а не ім'я
    # поля, керує морфологією й ключем у subject -- тому схема може
    # називати поля як завгодно (applicant_surname, prizvyshche).
    part: surname
    type: text
    extraction: rank_and_name_tokenized   # той самий виклик, інша частина результату
    normalization: nominative_case
    db_target: person

  - name: given_name
    # part: РОЛЬ поля в розборі рядка "звання ПІБ". Саме вона, а не ім'я
    # поля, керує морфологією й ключем у subject -- тому схема може
    # називати поля як завгодно (applicant_surname, prizvyshche).
    part: given_name
    type: text
    extraction: rank_and_name_tokenized
    normalization: nominative_case
    db_target: person

  - name: patronymic
    # part: РОЛЬ поля в розборі рядка "звання ПІБ". Саме вона, а не ім'я
    # поля, керує морфологією й ключем у subject -- тому схема може
    # називати поля як завгодно (applicant_surname, prizvyshche).
    part: patronymic
    type: text
    extraction: rank_and_name_tokenized
    normalization: nominative_case
    db_target: person

  # ВИПРАВЛЕНО (звірено з data/samples/leave/відпускний_шаблон.docx): "вид
  # відпустки" і "населений пункт" на реальному бланку -- ОДНЕ вільнотекстове
  # значення під одним спільним лейблом ("вид відпустки та найменування
  # населеного пункту, до якого звільнено військовослужбовця"), надруковане
  # одразу після слова "звільнений" в тому самому блоці/комірці. Старі окремі
  # regex-и (`leave_type` за фразою "звільнений у частину", якої в бланку
  # немає; `destination_location` тим же способом) ніколи не матчились.
  # Об'єднано за рішенням користувача -- категоріальне зіставлення з
  # dictionaries/leave_type.yaml для цього поля більше не виконується
  # автоматично (значення вільнотекстове, комбіноване).
  - name: leave_type_and_destination
    type: text
    extraction: block_before_label
    label_before: "вид відпустки та найменування населеного пункту"
    strip_prefix: "звільнений"
    db_target: fact_value

  # ВИПРАВЛЕНО за синтетичним набором: населений пункт НЕ входить в об'єднане
  # поле вище. На бланку лейбл розрізаний на два блоки, а значення стоїть МІЖ
  # ними: "(вид відпустки та найменування населеного пункту," / "м. Житомир" /
  # "до якого звільнено військовослужбовця)". Тому leave_type_and_destination
  # (шукає блок перед ПЕРШОЮ половиною лейбла) віддавав лише вид відпустки, і
  # місце губилось у 16 з 16 документів -- саме те поле, що відповідає на
  # питання "де ця людина".
  - name: destination_place
    type: text
    extraction: block_before_label
    label_before: "до якого звільнено військовослужбовця"
    dimension: leave_place
    # criticality явно: за замовчуванням поле з db_target additional_info
    # НЕкритичне, але це поле відповідає на друге за важливістю питання
    # системи -- "де ця людина" (project-overview.md: "скільки людей зараз у
    # відпустці" -> далі неминуче "де саме"). Порожнє місце в підтвердженому
    # записі означає факт відпустки без прив'язки до місця.
    criticality: critical
    db_target: additional_info

  - name: leave_year
    type: number
    extraction: derived_from
    derived_from: leave_type_and_destination
    derive: extract_year_suffix   # "за (\d{4}) рік", якщо є в тексті
    db_target: additional_info

  - name: duration_days
    type: number
    # dimension: поле стає ОКРЕМИМ рядком у facts БД-споживача. Без цього
    # воно лишається лише в additional_info, який завантажувач не читає,
    # тобто до бази не доходить узагалі (у facts немає JSON-колонки).
    dimension: leave_days
    extraction: regex
    # ВИПРАВЛЕНО за синтетичним набором: на бланку кількість днів надрукована
    # ЛИШЕ прописом ("терміном на" / "тринадцять" / "(кількість днів
    # прописом)") -- цифри в документі немає взагалі, тому старий паттерн на
    # \d+ давав None у 9 з 16 документів. Перший варіант -- пропис (основний
    # випадок), другий лишається для бланків із цифрою.
    regex_variants:
      - pattern: 'терміном\s+на\s+(?P<value>[а-яіїєґ''’\s]+?)\s*\(кількість днів'
      - pattern: 'терміном\s+(?:на\s+)+(?P<value>\d+)\s*\([^)]*\)\s*(?:діб|календарних днів|днів)'
    # Кількість днів -- НЕ незалежне значення: вона однозначно визначається
    # діапазоном (включно з обома кінцями: "з 10 по 22 травня" = 13 днів,
    # перевірено на 16/16 документів набору). Без цієї перевірки LEAVE-011
    # приймав `днів = 17` від моделі при порожньому полі на бланку й
    # відсутніх датах -- у базу пішла б ТРИВАЛІСТЬ БЕЗ ДАТ без жодного
    # маркера (build_record.check_consistency).
    consistency:
      rule: days_span_inclusive
      start: leave_start_date
      end: leave_end_date_planned
    db_target: additional_info

  - name: leave_start_date
    type: date
    extraction: regex
    normalization: iso_date
    regex_variants:
      # варіант 1: спільний рік наприкінці діапазону (фото2)
      - pattern: 'з\s+(?P<day>\d{1,2})\s+(?P<month>[а-яіїє]+|\d{1,2})\s+по\s+\d{1,2}\s+[а-яіїє]+\s+(?P<year>\d{4})\s*(?:р\.?|рок\w*)'
      # варіант 2: окремий рік на кожну дату (старіший бланк, приклад 1)
      - pattern: 'з\s*[«"“„]?(?P<day>\d{1,2})[»"”‟]?\s+(?P<month>\d{1,2}|[а-яіїє]+)\s+20(?P<year>\d{2})\s*(?:р\.?|рок\w*)'
    db_target: fact_date_start

  - name: leave_end_date_planned
    type: date
    extraction: regex
    normalization: iso_date
    regex_variants:
      - pattern: 'по\s+(?P<day>\d{1,2})\s+(?P<month>[а-яіїє]+|\d{1,2})\s+(?P<year>\d{4})\s*(?:р\.?|рок\w*)'
      - pattern: 'по\s*[«"“„]?(?P<day>\d{1,2})[»"”‟]?\s+(?P<month>\d{1,2}|[а-яіїє]+)\s+20(?P<year>\d{2})\s*(?:р\.?|рок\w*)'
    db_target: fact_date_end

  - name: actual_return_date
    type: date
    # dimension: поле стає ОКРЕМИМ рядком у facts БД-споживача. Без цього
    # воно лишається лише в additional_info, який завантажувач не читає,
    # тобто до бази не доходить узагалі (у facts немає JSON-колонки).
    dimension: leave_actual_return
    extraction: block_before_label
    label_before: "дата повернення"
    normalization: iso_date
    # Дата повернення не може бути РАНІШЕ планового кінця відпустки (16/16 у
    # наборі: повернення = кінець + 1 день). Це те поле, що ЗАКРИВАЄ відпустку,
    # тому хибне значення лишає людину "у відпустці" назавжди.
    consistency:
      rule: not_before
      not_before: leave_end_date_planned
    note: "Заповнюється після повернення, окремо від leave_end_date_planned. Може бути порожнім на момент видачі документа."
    db_target: additional_info

  # ВІДКЛАДЕНО: "№" у бланку зустрічається лише як "Додаток 30" (номер самого
  # ТИПУ бланка в Інструкції з діловодства -- константа, однакова на кожному
  # відпускному квитку) -- жодного реального регіструйного номера конкретного
  # документа в текстовому шарі docx/OCR не знайдено. Regex "перший рядок з
  # №" тихо повертав би "30" для кожного документа -- гірше, ніж чесне
  # no_value. Якщо реальний номер є лише в кутовому штампі (зображення),
  # це поле екстракції з тексту не підлягає.
  # ВИПРАВЛЕНО за синтетичним набором (11.08.2026). Раніше тут стояв
  # priority: deferred з коментарем "реального номера в бланку немає" -- це
  # висновок з ПОРОЖНЬОГО шаблону, де номер не надрукований. У заповнених
  # документах номер і дата видачі стоять ОДНИМ рядком: "№ 102    від
  # 09.05.2026". Обидва regex прив'язані до "від <дата>", тому вони не можуть
  # злапати "Додаток 30" -- саме через цей ризик поле й було відкладене.
  - name: document_number
    type: text
    extraction: regex
    dimension: document_number
    regex_variants:
      - pattern: '№\s*(?P<value>[\w/\-]+)\s+від\s+\d{1,2}\.\d{1,2}\.\d{4}'
    db_target: additional_info

  # ВИПРАВЛЕНО за синтетичним набором: старі паттерни були загальними датами
  # й брали ПЕРШИЙ збіг у тексті -- а перша дата в документі це початок
  # відпустки, не дата видачі. Наслідок: 13 з 16 документів отримували
  # правдоподібну, але неправильну дату видачі й статус confirmed.
  - name: document_date
    type: date
    extraction: regex
    normalization: iso_date
    dimension: document_date
    regex_variants:
      - pattern: '№\s*[\w/\-]+\s+від\s+(?P<day>\d{1,2})\.(?P<month>\d{1,2})\.(?P<year>\d{4})'
    db_target: additional_info

  - name: travel_document_number
    type: text
    dimension: travel_document
    extraction: regex
    normalization: null_if_not_issued   # сентинел "не видавались" -> null, підтверджено-порожнє
    not_issued_sentinel: "не видавались"
    regex_variants:
      - pattern: 'документи за №\s*(?P<value>.+?)\n'
    db_target: additional_info

  # --- Зв'язок документ -> документ (скасовує/змінює) ---
  # architecture-proposal.md розд. 2 п.4 вимагає ОКРЕМУ таблицю зв'язків
  # документ->документ: "наказ, що скасовує чи змінює інший наказ, інакше
  # людина назавжди лишається зі старим статусом". У схемі команди БД такої
  # таблиці немає, і в `facts` немає колонки `superseded_by`
  # (db-handoff-notes.md п.12). Наш бік може зробити РІВНО одне: витягти
  # ознаку з самого документа й віддати її у виразній формі -- зіставити пару
  # можна лише запитом ПО ВСІХ документах, а не з одного документа.
  #
  # Що реально надруковано (перевірено на трьох парах еталона):
  #   LEAVE-016: "(виданий замість анульованого квитка № 157)"  -- є НОМЕР;
  #   TRIP-014:  "(переоформлено замість посвідчення № 254)"    -- є НОМЕР;
  #   LEAVE-014: "(перервана, відкликаний з відпустки)"         -- номера НЕМА.
  # Скасований документ пари (LEAVE-013/015, TRIP-013) не містить ЖОДНОЇ
  # ознаки -- він і не може знати, що його скасують. Тобто закрити старий факт
  # без таблиці зв'язків неможливо в принципі, і це не наша прогалина.
  - name: supersedes_document_number
    type: text
    extraction: regex
    link_type: supersedes
    # llm_fallback: false -- ВІДСУТНІСТЬ позначки скасування є нормою (58 з 60
    # документів набору). Питати модель "який документ скасовує цей?" на
    # документі без позначки означає просити вигадати номер -- рівно той клас
    # тихої помилки, проти якого стоїть ground_llm_value.
    llm_fallback: false
    regex_variants:
      - pattern: 'замість\s+(?:анульованого\s+)?квитка\s*№\s*(?P<value>[\w/\-]+)'
    db_target: additional_info

  - name: supersession_note
    type: text
    extraction: regex
    link_type: supersedes
    llm_fallback: false
    # Той самий зв'язок, але БЕЗ номера: бланк каже, що відпустку перервано /
    # квиток анульовано, не називаючи скасованого документа. Для рев'юера це
    # різниця між "знайди документ № 157" і "знайди попередній квиток цієї
    # людини".
    regex_variants:
      - pattern: '(?P<value>перервана|відкликаний з відпустки|анульован\w*|переоформлено)'
    db_target: additional_info

  # --- Реєстр об'єктів, не довідник значень ---
  # ПРИБРАНО: issuing_unit шукав буквально "ВІЙСЬКОВА ЧАСТИНА" -- у бланку це
  # не текст, а опис місця для кутового штампа/печатки ("Кутовий штамп
  # військової частини (установи)"), не друкований рядок. Текстовий шар
  # docx/OCR не дасть цю фразу за жодних умов -- прибрано за рішенням
  # користувача, а не залишено як завідомо мертве поле.

  - name: unit_to_report
    type: object_ref
    # dimension: поле стає ОКРЕМИМ рядком у facts БД-споживача. Без цього
    # воно лишається лише в additional_info, який завантажувач не читає,
    # тобто до бази не доходить узагалі (у facts немає JSON-колонки).
    dimension: unit_to_report
    registry: military_unit
    # ВИПРАВЛЕНО (звірено з data/samples/leave/відпускний_шаблон.docx): фрази
    # "військову частину" тут немає -- реальний текст "зобов'язаний прибути
    # до місця служби у (значення)\n(найменування військової частини або
    # населеного пункту)" -- той самий патерн "значення / лейбл під ним",
    # що й destination_org у deployment_certificate. Старий regex ніколи не
    # матчився на реальному бланку.
    extraction: block_before_label
    label_before: "найменування військової частини або населеного пункту"
    db_target: additional_info

  - name: co_travelers
    type: object_ref
    registry: person
    multiple: true
    priority: deferred
    note: "Поле «Разом з ... прямують ...» — 0 або більше супутників."
    db_target: additional_info

  - name: authorizing_commander
    type: object_ref
    registry: person
    priority: deferred
    note: "Підпис на лицьовій стороні. Не впливає на підрахункові запити — відкладено."
    db_target: additional_info

out_of_scope:
  - registration_marks_table

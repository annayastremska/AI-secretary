# ЗРАЗОК конфігу. Скопіюйте в config.yaml і правте під свою машину:
#     cp config.example.yaml config.yaml
# Сам config.yaml у .gitignore: це налаштування конкретної машини
# (шляхи, наявність моделі), не частина коду.
#
# Значення за замовчуванням -- у pipeline/config.py; тут лише те, що
# відрізняється для конкретної машини. Шляхи -- відносні до кореня репо.

paths:
  input_dir: data/inbox        # куда кладуться вхідні файли (папка-приймач)
  output_dir: data/output

intake:
  # Переносити оброблені файли з папки-приймача, щоб вона справді
  # спорожнялась. Діє лише при скануванні каталогу: файл, переданий через
  # --input, лишається на місці.
  archive: true
  processed_dir: data/processed   # confirmed / needs_review / duplicate
  failed_dir: data/failed         # unresolved -- потребує людини

llm:
  enabled: true
  # Шлях, куди кладе ваги `python pipeline/scripts/download_model.py` -- правити
  # не потрібно. Якщо машина не тягне 12B, є --size 4b (тоді змініть 12b на 4b
  # у назві файлу нижче).
  # Якщо ваг ще немає, прогін не падає: буде попередження, а поля
  # extraction: llm лишаться чесно позначеними прогалинами.
  model_path: models/mamaylm-12b-q4_k_m.gguf
  n_gpu_layers: 0              # 0 = CPU; -1 = усі шари на GPU
  batch_size: 4                # полів на один LLM-виклик
  self_consistency_n: 1         # >1 = кілька семплів + majority_vote (дорожче)
  max_context_chars: 6000

ocr:
  # none -> обробляються лише docx (зображення явно відхиляються).
  # surya -> потрібен встановлений surya-ocr; на Windows зазвичай ще й
  # готовий бінарник llama-server (Surya запускає його всередині).
  engine: none
  llama_server_path: null
  # Шари моделі розпізнавання на GPU (LLAMA_CPP_NGL внутрішнього сервера
  # Surya). null = дефолт surya (99, тобто ВСІ шари на GPU -- на Windows із
  # winget-збіркою це Vulkan на вбудованій графіці). 0 = чистий CPU: удвічі
  # повільніше, але без витоку пам'яті в сервері
  # (docs/research/2026-08-14_ocr-ngl0-control-run.md).
  n_gpu_layers: null
  # Host prompt cache внутрішнього llama-server Surya, МіБ
  # (LLAMA_ARG_CACHE_RAM). 0 (дефолт пайплайна) = вимкнено: для OCR кеш не
  # дає жодного влучення (кожен промпт містить унікальне зображення) і лише
  # монотонно з'їдає RAM, ~+170-195 МБ на фото
  # (docs/known-weak-spots.md розд. 2.18, №3). Не вмикати без причини.
  cache_ram_mb: 0
  # Guided decoding для layout-проходу surya. null = дефолт пайплайна
  # ВИМКНЕНО: на llama.cpp guided-схема layout зламана завжди (`\d` у GBNF
  # не парситься) і блокує запасний поблоковий шлях розпізнавання.
  guided_layout: null
  # Експериментальні ручки патологічного кадру (цикл повторів розпізнавання:
  # один такий кадр коштував 30 хв). null = НЕ чіпати дефолти surya (стеля
  # 12288 токенів, 3 повтори). Стеля 3072 + recognition_max_retries: 1 дали
  # 2.4× на цьому кадрі, але з ПРОСІДАННЯМ якості: примусовий поблоковий
  # шлях повернув текст, на якому витяг узяв чужий ПІБ з довірою 0.9
  # (docs/known-weak-spots.md розд. 9, розд. 2). Вмикати лише з
  # передзаміром якості на повному корпусі.
  max_tokens_full_page: null
  recognition_max_retries: null
  # true -> HF_HUB_OFFLINE=1: surya не звертається до HuggingFace навіть за
  # своїми файлами моделі. Вмикати ПІСЛЯ першого успішного прогону (коли кеш
  # моделі вже прогрітий) -- тоді твердження «нічого не йде в мережу»
  # перевіряється, а не приймається на віру. На чистій машині з цим прапорцем
  # перший запуск упаде: вагам ніде взятись.
  # Зображення документів не йдуть у мережу й без цього: внутрішній сервер
  # розпізнавання слухає лише loopback, а зовнішній SURYA_INFERENCE_URL код
  # відхиляє (pipeline/ocr/surya_reader.py, check_inference_url).
  hub_offline: false

storage:
  # Локальні файли -- єдиний бекенд. Зовнішнє сховище й БД -- поза межами
  # цієї частини роботи.
  local_root: data/output

review:
  sample_rate: 20              # 1 з 20 підтверджених документів -> ручна перевірка (5%)

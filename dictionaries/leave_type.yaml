# Довідник допустимих значень категорії leave_type (вид відпустки).
# Джерело: ст. 10-1 Закону України «Про соціальний і правовий захист
# військовослужбовців та членів їх сімей» (переказ, не точний текст закону —
# перевірити з профільним офіцером/юристом перед використанням у продакшн).
category: leave_type
values:
  - code: annual_basic
    label: "Щорічна основна відпустка"
    aliases:
      - "щорічна основна відпустка"
      - "щорічної основної відпустки"
      - "щорічна основна"
      - "основна відпустка"
      # суфікс "за NNNN рік" відсікається regex-правилом при нормалізації,
      # рік іде в окреме поле leave_year — не додавати рік в aliases.

  - code: annual_additional
    label: "Щорічна додаткова відпустка (за особливий характер служби)"
    aliases:
      - "щорічна додаткова відпустка"
      - "додаткова відпустка за особливий характер служби"

  - code: family
    label: "Відпустка за сімейними обставинами"
    aliases:
      - "за сімейними обставинами"
      - "сімейна відпустка"
      - "відпустка за сімейними обставинами"

  - code: medical_treatment
    label: "Відпустка для лікування (за висновком ВЛК)"
    aliases:
      - "відпустка для лікування"
      - "за висновком влк"
      - "лікувальна відпустка"

  - code: childcare
    label: "Відпустка по догляду за дитиною"
    aliases:
      - "по догляду за дитиною"
      - "відпустка по догляду за дитиною"

  - code: study
    label: "Відпустка для обов'язкового навчання"
    aliases:
      - "навчальна відпустка"
      - "відпустка для навчання"

  - code: post_captivity
    label: "Додаткова відпустка після звільнення з полону"
    aliases:
      - "після звільнення з полону"
      - "відпустка після полону"

  - code: equipment_loss
    label: "Додаткова відпустка за знищену техніку"
    aliases:
      - "за знищену техніку"
      - "відпустка за знищену техніку"

  - code: cadet_vacation
    label: "Канікулярна відпустка (курсанти)"
    aliases:
      - "канікулярна відпустка"
      - "зимові канікули"
      - "літні канікули"

# Незнайдений термін -> не 0, а "термін не розпізнано" (вимога 3.4 ТЗ),
# і запис у чергу на перегляд (новий alias чи справді нова категорія).
unmatched_term_policy: queue_for_review

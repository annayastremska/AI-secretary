# Довідник допустимих значень категорії military_rank (військове звання).
# Джерело: Статут внутрішньої служби ЗСУ, з урахуванням реформи 2024 р.
# (скасовано прапорщик/старший прапорщик; додано штаб-/майстер-сержантів).
# Чернетка на основі відкритих джерел — звірити з чинним наказом МО перед
# використанням у продакшн.
category: military_rank
values:
  - code: recruit
    label: "Рекрут"
    aliases: ["рекрут"]

  - code: soldier
    label: "Солдат"
    # "рядовий" -- традиційний/донедавна офіційний термін для того самого
    # базового звання; знайдено як прогалину під час тестування на deployment
    # (реальний приклад "рядовий Бевзенко..." не розпізнався без цього alias).
    aliases: ["солдат", "рядовий"]

  - code: senior_soldier
    label: "Старший солдат"
    aliases: ["старший солдат"]

  - code: junior_sergeant
    label: "Молодший сержант"
    aliases: ["молодший сержант", "мол. сержант"]

  - code: sergeant
    label: "Сержант"
    aliases: ["сержант"]

  - code: senior_sergeant
    label: "Старший сержант"
    aliases: ["старший сержант", "ст. сержант"]

  - code: chief_sergeant
    label: "Головний сержант"
    aliases: ["головний сержант"]

  - code: staff_sergeant
    label: "Штаб-сержант"
    aliases: ["штаб-сержант"]

  - code: master_sergeant
    label: "Майстер-сержант"
    aliases: ["майстер-сержант"]

  - code: senior_master_sergeant
    label: "Старший майстер-сержант"
    aliases: ["старший майстер-сержант"]

  - code: chief_master_sergeant
    label: "Головний майстер-сержант"
    aliases: ["головний майстер-сержант"]

  - code: junior_lieutenant
    label: "Молодший лейтенант"
    aliases: ["молодший лейтенант", "мол. лейтенант"]

  - code: lieutenant
    label: "Лейтенант"
    aliases: ["лейтенант"]

  - code: senior_lieutenant
    label: "Старший лейтенант"
    aliases: ["старший лейтенант", "ст. лейтенант", "ст. л-т"]

  - code: captain
    label: "Капітан"
    aliases: ["капітан"]

  - code: major
    label: "Майор"
    aliases: ["майор"]

  - code: lieutenant_colonel
    label: "Підполковник"
    aliases: ["підполковник"]

  - code: colonel
    label: "Полковник"
    aliases: ["полковник"]

  - code: brigadier_general
    label: "Бригадний генерал"
    aliases: ["бригадний генерал"]

  - code: major_general
    label: "Генерал-майор"
    aliases: ["генерал-майор"]

  - code: lieutenant_general
    label: "Генерал-лейтенант"
    aliases: ["генерал-лейтенант"]

  - code: general
    label: "Генерал"
    aliases: ["генерал", "генерал армії україни"]

unmatched_term_policy: queue_for_review

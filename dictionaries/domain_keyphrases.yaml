# Ключові фрази для класифікації домену (розділ 3, рівні A+B) + описи для
# LLM-fallback (рівень C). Фрази взяті з реальних шаблонів у data/samples/,
# не вигадані. Заголовок (title) важить ×3, фраза тіла (body) — ×1.
domains:
  leave:
    title: ["відпускний квиток"]
    body:
      - "звільнений"
      - "терміном на"
      - "діб"
      - "календарних днів"
      - "щорічної основної відпустки"
      - "щорічну відпустку"
      - "у відпустку"
      - "надати мені"
      - "надати відпустку"
      - "за сімейними обставинами"
      - "після закінчення строку відпустки"
      - "вибувати за межі гарнізону"
      - stem: "відпуст"   # відпустка/відпустку/відпустці/відпусток
    description: "документи про відпустку військовослужбовця (відпускний квиток, рапорт на відпустку)"

  deployment:
    title: ["посвідчення про відрядження"]
    body:
      - "відряджено"
      - "відрядженому до"
      - "термін відрядження"
      - "пункти призначень"
      - "відряджений"
      - "пункт призначення"
      - "мета відрядження"
      - "підстава відрядження"
      - "службове відрядження"
      - "вибув із"
      - "прибув до"
      - "триразовим харчуванням"
      - stem: "відрядж"   # відрядження/відряджений/відряджено/відрядженому
    description: "документи про службове відрядження (посвідчення про відрядження)"

  equipment:
    title: ["книга", "обліку озброєння", "військової техніки", "технічним станом"]
    body:
      - "заводський"
      - "державний (військовий)"
      - "технічний стан"
      - "дорожній лист"
      - "моторесурс"
      - "наряд на використання машин"
      - "паспорт (формуляр)"
      - "групи експлуатації"
      - "витрата пального"
      - stem: "техніч"   # технічний/технічного/технічна/технічне/технічні
      - stem: "озброєн"   # озброєння/озброєний/озброєна
    description: "документи обліку озброєння, техніки, транспортних засобів (книга обліку техніки, дорожній лист)"

  staffing:
    title: ["електронний журнал", "обліку особового складу", "штатно-посадовий облік"]
    body:
      - "штатно-посадовий"
      - "особовий склад"
      - "індекс посади"
      - "рнокпп"
      - "наказ про зарахування до списків"
      - "тимчасово відсутній особовий склад"
      - "табель особового складу"
      - stem: "особов"   # особового/особової -- не покрито "особовий склад" вище
      - stem: "штатн"   # штатний/штатного/штатну -- не покрито "штатно-посадовий" вище
    description: "документи обліку особового складу частини (штатно-посадовий облік, електронний журнал обліку особового складу)"

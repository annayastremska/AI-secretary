# Ключові фрази для класифікації домену (розділ 3, рівні A+B) + описи для
# LLM-fallback (рівень C). Фрази взяті з реальних шаблонів у data/samples/,
# не вигадані. Заголовок (title) важить ×3, фраза тіла (body) — ×1.
#
# `subject_kind:` -- МАПІНГ «домен -> вид суб'єкта», рівень 2 у
# pipeline/subject_kind.py. Читається ЛИШЕ коли схеми немає: за наявної схеми
# старше її власне оголошення (`subject_kind:` у schemas/*.yaml), бо схема
# прямо каже, що описує, а домен -- це підрахунок ключових фраз, здатний із
# нею не збігтися.
#
# Живе тут, а не в коді, навмисно: інакше ми знімаємо один хардкод
# (`object_kinds.code = 'person'` у завантажувачі БД) і одразу додаємо інший.
# Допустимі значення -- закритий перелік (pipeline/subject_kind.py:
# DECLARABLE_SUBJECT_KINDS): person / equipment / task / unit -- рядки
# `object_kinds` у БД -- плюс `none` = суб'єкта в документі НЕМА. Невідоме
# значення тут -- помилка на завантаженні (domain_subject_kind_problems), а не
# сміття в `objects.kind_id` (NOT NULL).
#
# Чого мапінг НЕ говорить: КІЛЬКОСТІ суб'єктів. `staffing` -- це person, але
# багато осіб; вид і кількість -- різні питання, і друге вирішується не тут.
domains:
  leave:
    subject_kind: person
    title: ["відпускний квиток"]
    body:
      - "звільнений"
      - "терміном на"
      - "діб"
      - "календарних днів"
      - "щорічної основної відпустки"
      - "щорічну відпустку"
      - "у відпустку"
      - "надати мені"
      - "надати відпустку"
      - "за сімейними обставинами"
      - "після закінчення строку відпустки"
      - "вибувати за межі гарнізону"
      - stem: "відпуст"   # відпустка/відпустку/відпустці/відпусток
    description: "документи про відпустку військовослужбовця (відпускний квиток, рапорт на відпустку)"

  deployment:
    subject_kind: person
    title: ["посвідчення про відрядження"]
    body:
      - "відряджено"
      - "відрядженому до"
      - "термін відрядження"
      - "пункти призначень"
      - "відряджений"
      - "пункт призначення"
      - "мета відрядження"
      - "підстава відрядження"
      - "службове відрядження"
      - "вибув із"
      - "прибув до"
      - "триразовим харчуванням"
      - stem: "відрядж"   # відрядження/відряджений/відряджено/відрядженому
    description: "документи про службове відрядження (посвідчення про відрядження)"

  # Домен НОРМАТИВНИХ документів. Додано 13.08.2026, бо його відсутність була
  # не прогалиною, а джерелом ВПЕВНЕНО НЕПРАВИЛЬНОЇ відповіді: Інструкція з
  # діловодства (402898 символів) класифікувалась як `equipment` -- просто
  # тому, що серед чотирьох наявних доменів у неї найбільше збігів саме там.
  # Тепер це має вагу: команда БД додала колонку `documents.domain`, тобто
  # неправильний домен осідає в базі, а не лише вибирає теку у сховищі.
  #
  # Фрази підібрані так, щоб НЕ збігатися з самими бланками, а це неочевидно:
  # кожен бланк у шапці посилається "до Інструкції з діловодства у Збройних
  # Силах України" -- у РОДОВОМУ відмінку. Тому називна форма "інструкція з
  # діловодства" дає 1 збіг в інструкції й 0 у бланку (перевірено підрахунком
  # на LEAVE-001), а "цією інструкцією" -- 13 проти 0. Стем узяти НЕ можна:
  # phrase_in_text вимагає межу слова лише на початку, тому "інструкці"
  # зматчився б і в бланку.
  normative:
    # ЄДИНИЙ домен, у якого вид -- `none`, і саме він є причиною, чому мапінгу
    # потрібне значення «немає», а не лише person/equipment. Інструкція з
    # діловодства суб'єкта не має взагалі: вона не запис про особу чи техніку,
    # а правила, за якими такі записи складаються. Без `none` мапінг мусив би
    # вигадати їй якийсь вид, і в реєстрі назавжди осів би фантомний об'єкт --
    # шляху видалення в завантажувачі БД немає.
    # Наслідок для виходу: `create_subject_object: false`, об'єкт НЕ
    # створюється; статус документа при цьому не псується -- це відповідь, а
    # не невизначеність (pipeline/subject_kind.py: NO_SUBJECT vs UNKNOWN).
    subject_kind: none
    # `kind: procedural` -- не тематичний домен, а РІД документа: правила, за
    # якими складаються інші документи, а не запис про особу чи техніку.
    # Перевіряється окремо й ПЕРШИМ (pipeline/classification/classify.py):
    # змагатися балами з тематичними доменами тут безпідставно, бо інструкція
    # містить у собі всі бланки й дає схожі бали всім доменам одночасно.
    kind: procedural
    title: ['інструкція з діловодства']
    body: ['цією інструкцією', 'загальні положення', 'ця інструкція']
    description: >
      нормативні й процедурні документи (інструкції, накази загальної дії,
      методичні рекомендації) -- не джерело фактів про особу чи техніку, а
      правила, за якими інші документи складаються. Окрема підсистема:
      context/normative-docs-subsystem.md

  equipment:
    subject_kind: equipment
    title: ["книга", "обліку озброєння", "військової техніки", "технічним станом"]
    body:
      - "заводський"
      - "державний (військовий)"
      - "технічний стан"
      - "дорожній лист"
      - "моторесурс"
      - "наряд на використання машин"
      - "паспорт (формуляр)"
      - "групи експлуатації"
      - "витрата пального"
      - stem: "техніч"   # технічний/технічного/технічна/технічне/технічні
      - stem: "озброєн"   # озброєння/озброєний/озброєна
    description: "документи обліку озброєння, техніки, транспортних засобів (книга обліку техніки, дорожній лист)"

  staffing:
    # person, і це відповідь ЛИШЕ на питання «який вид», не на «скільком».
    # Штатно-посадовий облік -- це БАГАТО осіб в одному документі, тобто
    # `subject` (плаский, одна особа) для нього замалий. Мапінг тут не бреше:
    # вид справді person; кількість -- окрема, ще не вирішена задача
    # (`multiple: true` у схемі, context/open-questions.md).
    subject_kind: person
    title: ["електронний журнал", "обліку особового складу", "штатно-посадовий облік"]
    body:
      - "штатно-посадовий"
      - "особовий склад"
      - "індекс посади"
      - "рнокпп"
      - "наказ про зарахування до списків"
      - "тимчасово відсутній особовий склад"
      - "табель особового складу"
      - stem: "особов"   # особового/особової -- не покрито "особовий склад" вище
      - stem: "штатн"   # штатний/штатного/штатну -- не покрито "штатно-посадовий" вище
    description: "документи обліку особового складу частини (штатно-посадовий облік, електронний журнал обліку особового складу)"

# Відповідність: ключ еталона -> поле нашої схеми.
#
# Живе в YAML, а не в коді, з тієї самої причини, що й решта схемних рішень:
# новий шаблон із власним набором полів не має вимагати правки скрипта оцінки.
#
# Джерело еталона: data/eval/synthetic-2026-05/per-document/<ID>.json,
# розділ "правильні_відповіді" (плюс "людина" для ПІБ/звання).
#
# compare: як зіставляти
#   exact       -- рівність після strip
#   date        -- обидва боки як ISO YYYY-MM-DD
#   number      -- як int
#   contains    -- еталон має міститись у нашому значенні. Допускається ЛИШЕ
#                  там, де на бланку лейбл і значення фізично злиті в один
#                  рядок, а еталон записує тільки значення. Кожен випадок
#                  обґрунтований коментарем поруч; решта -- exact, бо м'яке
#                  порівняння приховує приклеєний сусідній блок.
#   category    -- порівнюємо label або code нашого {code,label} з рядком еталона
#
# printed: ключі розділу "надруковано" того самого JSON -- те, що ФІЗИЧНО
#   стоїть на бланку. Якщо всі перелічені ключі присутні й порожні, очікуване
#   значення поля -- null, і null від пайплайна це УСПІХ (рішення Анни,
#   13.08.2026). Без цього еталон брав відповідь зі СЦЕНАРІЮ, а не з паперу, і
#   винагороджував галюцинацію: LEAVE-011 має DAYS_WORDS: "", але
#   правильні_відповіді.днів = 11, тож модель, що вигадала б саме "11", була б
#   зарахована як правильна, а чесний null -- як помилка.
#   Ключ, відсутній у "надруковано" цього шаблону, ігнорується (не рахується
#   порожнім). Якщо жодного з ключів немає -- правило не застосовується.

# Мапа «тип документа в еталоні -> template схеми». ЄДИНЕ джерело для
# template_ok і для зіставлення "надруковано" (R-A1-05 + R-A2-09: доти той
# самий літерал-словник жив у двох місцях скрипта оцінки, і розбіжність між
# копіями не могла бути виявлена нічим). Новий шаблон = новий рядок тут.
doc_types:
  "відпускний квиток": leave_ticket
  "посвідчення про відрядження": deployment_certificate

templates:
  leave_ticket:
    номер_документа: {field: document_number, compare: exact, printed: [DOC_NUMBER]}
    дата_видачі:     {field: document_date,   compare: date,  printed: [ISSUE_DATE]}
    початок:         {field: leave_start_date,       compare: date, printed: [START_D, START_M, START_Y]}
    кінець:          {field: leave_end_date_planned, compare: date, printed: [END_D, END_M, END_Y]}
    повернення:      {field: actual_return_date,     compare: date, printed: [RET_D, RET_M, RET_Y]}
    днів:            {field: duration_days,          compare: number, printed: [DAYS_WORDS]}
    # Населений пункт -- окреме поле destination_place (лейбл розрізаний на два
    # блоки, значення стоїть МІЖ ними). Значення на бланку -- чистий топонім
    # ("м. Житомир"), рівно те, що в еталоні: 16/16 збігаються посимвольно
    # (замір 13.08), тому exact, а не contains. Саме тут ловиться приклеєний
    # сусідній блок ("м. Полтава, військова частина А4419").
    місце:           {field: destination_place, compare: exact, printed: [LEAVE_PLACE]}
    # ІСТОРИЧНЕ: тут стояв contains із коментарем "вид відпустки й населений
    # пункт -- одне вільнотекстове поле". Це вже не так: за коментарем у
    # schemas/leave_ticket.yaml:70-96 місце вийняте в destination_place, а
    # leave_type_and_destination віддає ЛИШЕ вид відпустки -- 16/16 рівні
    # еталону посимвольно. Обґрунтування для contains зникло разом із
    # об'єднанням, тому exact.
    підстава:        {field: leave_type_and_destination, compare: exact, printed: [LEAVE_TYPE]}
    # ІСТОРИЧНЕ: тут стояв contains з обґрунтуванням "лейбл і значення злиті на
    # бланку, вимагати exact означало б вимагати від екстрактора викидати слова
    # бланка". Обґрунтування знято 14.08.2026: викидати слова бланка -- це саме
    # НАША робота, бо ми читаємо форму й знаємо, що "військова частина" тут
    # надрукований текст, а не дані. Схема тепер знімає цей префікс
    # (schemas/leave_ticket.yaml, strip_prefix), значення -- чистий код
    # "А0000". Це був ОСТАННІЙ contains у мапінгу: порівняння стало повністю
    # строгим, тобто приклеєний сусідній блок більше не може зійтися ніде.
    військова_частина: {field: unit_to_report, compare: exact, printed: [UNIT, RETURN_UNIT]}
    # ДОДАНО 14.08.2026 (R-A2-03). Поле є в схемі, друкується на бланку (VPD),
    # а сценарного ключа немає -- тому міряється проти надрукованого.
    # `printed_not_issued` -- фраза, якою бланк ПРЯМО каже «значення немає»
    # (та сама, що not_issued_sentinel схеми): для таких документів очікуване
    # значення null, і чесний null пайплайна -- успіх, а не помилка.
    впд: {field: travel_document_number, compare: exact, printed: [VPD],
          expected_printed: VPD, printed_not_issued: "не видавались"}

  deployment_certificate:
    номер_документа: {field: document_number, compare: exact, printed: [DOC_NUMBER]}
    дата_видачі:     {field: document_date,   compare: date,  printed: [ISSUE_DATE]}
    початок:         {field: deployment_start_date, compare: date, printed: [START_D, START_M, START_Y]}
    кінець:          {field: deployment_end_date,   compare: date, printed: [END_D, END_M, END_Y]}
    днів:            {field: deployment_days,       compare: number, printed: [DAYS]}
    # Бланк друкує пункт призначення чистим топонімом (DEST, він же DEST_CITY),
    # і всі 14 значень еталона -- рівно він. Схема застерігає "можливо кілька
    # пунктів в одному рядку" (schemas/deployment_certificate.yaml:86), але в
    # наборі такого документа немає; якщо з'явиться -- еталон має записати
    # ПОВНИЙ рядок з усіма пунктами, а не перший. exact, бо саме на цьому полі
    # 13.08 зафіксовано приклеювання сусіднього блоку DEST_ORG.
    місце:           {field: destination_points, compare: exact, printed: [DEST, DEST_CITY]}
    # PURPOSE друкується окремим вільнотекстовим полем і в еталоні записаний
    # посимвольно так само (14/14 у розділі "надруковано"), тому exact.
    підстава:        {field: purpose, compare: exact, printed: [PURPOSE]}
    # DEST_ORG -- окреме поле бланка, еталон записує його цілком
    # ("Центральна база зберігання майна (в/ч Т3011)"); 14/14 наших значень
    # рівні йому посимвольно (замір 13.08), тому exact.
    організація:     {field: destination_org, compare: exact, printed: [DEST_ORG]}
    # ДОДАНО 14.08.2026. Поле є в схемі, є на бланку (POSITION), і через
    # `dimension: position` доходить до facts окремим фактом -- а прилад його не
    # міряв ЗОВСІМ, бо в `правильні_відповіді` ключа для нього немає. Ціна цієї
    # сліпоти заміряна: місяць значення тихо обрізалось до "частина А0000" з
    # провенансом `matched` і confidence 0.9, і 141/141 не змінилось ні від
    # поломки, ні від виправлення (розд. 5.7).
    #
    # `expected_printed` -- очікуване беремо з "надруковано", бо сценарної
    # відповіді для цього поля не існує. Еталон не редагувався.
    посада:          {field: position_and_workplace, compare: exact, expected_printed: POSITION}

# Яка пара ключів утворює діапазон дат документа. Якщо НАДРУКОВАНИЙ кінець
# раніше за надрукований початок (вада `swapped_dates`, TRIP-011: START_D=22,
# END_D=20), правильна відповідь -- надруковані дати ПЛЮС позначка
# суперечності: `date_range_error` виставлений і запис НЕ порахований фактом
# (`confirmed: false`). Перестановку дат на «здоровий сенс» прилад вважає
# помилкою: документ не каже, що саме хибне -- день початку, день кінця чи
# порядок, -- і надрукований DAYS=3 сходиться з усіма трьома варіантами.
#
# Умова перевірки читається з "надруковано", а не з поля "вада": прилад не
# знає, які документи набору зіпсовані навмисно, тому та сама перевірка
# спрацює й на реальному бланку з опискою.
#
# Без цього блоку (до 14.08.2026) міряли лише ЗНАЧЕННЯ, тож пайплайн, що
# віддав надруковане й промовчав про суперечність, отримував ті самі 10/10.
range_checks:
  leave_ticket:            {start: початок, end: кінець}
  deployment_certificate:  {start: початок, end: кінець}

# ПІБ і звання -- спільні для всіх шаблонів, беруться з розділу "людина".
# printed вказує на PERSON_FULL/PERSON_SHORT: якщо на бланку ПІБ не
# надруковано (LEAVE-011), то й звання там немає -- воно друкується в тому
# самому рядку -- тож обидва поля очікуються як null.
# СВІДОМО НЕМІРЯНІ поля схем (R-A2-03). Зворотний прохід check_mapping тепер
# вимагає, щоб КОЖНЕ активне поле схеми або мірялось ключем мапінгу, або
# стояло тут із причиною -- тиша більше неможлива. Запис, що застарів (поле
# стало мірятись або зникло зі схеми), теж дає помилку мапінгу.
unmeasured:
  leave_ticket:
    surname: "входить у перевірку ПІБ (person_alias, порівняння множиною токенів)"
    given_name: "входить у перевірку ПІБ (person_alias)"
    patronymic: "входить у перевірку ПІБ (person_alias)"
    leave_year: "похідне від leave_type_and_destination («за NNNN рік»); окремого сценарного ключа немає, правило складання очікуваного з надрукованого ще не погоджене"
    supersedes_document_number: "міряється агрегатно перевіркою «зв'язок_скасування» (document_links), не по-польово"
    supersession_note: "міряється агрегатно перевіркою «зв'язок_скасування» (document_links), не по-польово"
  deployment_certificate:
    surname: "входить у перевірку ПІБ (person_alias, порівняння множиною токенів)"
    given_name: "входить у перевірку ПІБ (person_alias)"
    patronymic: "входить у перевірку ПІБ (person_alias)"
    basis_order_date: "друкується всередині ORDER_BASIS одним рядком; правило розкладання очікуваного з надрукованого ще не погоджене (відкритий запит A4 у known-weak-spots розд. 7)"
    basis_order_number: "друкується всередині ORDER_BASIS одним рядком; правило розкладання очікуваного з надрукованого ще не погоджене (відкритий запит A4)"
    supersedes_document_number: "міряється агрегатно перевіркою «зв'язок_скасування» (document_links), не по-польово"
    supersession_note: "міряється агрегатно перевіркою «зв'язок_скасування» (document_links), не по-польово"

person:
  ПІБ:
    # Еталон дає "Лемешко Соломія Романівна" одним рядком у називному --
    # порівнюємо з нашим subject.person_alias, який складається так само.
    field: person_alias
    compare: name
    printed: [PERSON_FULL, PERSON_SHORT]
  звання:
    field: rank
    compare: category
    printed: [PERSON_FULL, PERSON_SHORT]

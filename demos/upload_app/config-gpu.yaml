# Профіль апки для GPU-сервера (H100), НЕ для ноутбука.
#
# Локальний профіль -- config-app.yaml (CPU, Windows-шляхи). Цей файл
# вибирається змінною оточення:
#     APP_PIPELINE_CONFIG=demos/upload_app/config-gpu.yaml
#
# Навіщо окремий файл, а не правки в тому самому: config-app.yaml містить
# абсолютний Windows-шлях до llama-server і n_gpu_layers: 0 -- на Linux із
# H100 обидва значення неправильні, а тримати один файл із коментарями
# «на сервері закоментуй це» означає, що хтось колись закоментує не те.
#
# Розгортання -- docs/deploy-gpu-server.md.

paths:
  input_dir: data/inbox
  # ОКРЕМИЙ вихід для демо-набору, і це не косметика: у базу віддається вміст
  # РІВНО цієї папки. `data/output/` лишається для наших тестових прогонів --
  # там осідає все, що ми колись проганяли, включно зі старим корпусом
  # LEAVE/TRIP, чиї люди зі штаткою не сходяться. Якби обидва писали в одне
  # місце, «що вантажити в базу» довелося б відбирати очима по 150 файлах.
  output_dir: data/output-demo

intake:
  archive: true
  processed_dir: data/processed
  failed_dir: data/failed

llm:
  enabled: true
  # АБСОЛЮТНИЙ шлях у СПІЛЬНУ теку вагів, не в клон репозиторію: ваги
  # спільні на всіх (16 ГБ), а клонів на машині кілька.
  #
  # Виправлено 25.08.2026. Раніше тут стояло `models/mamaylm-12b-q4_k_m.gguf`
  # -- файла з такою назвою на сервері НЕМА і не було; на машині є рівно
  # один gguf, і це 27B. Тобто профіль був непрацездатний, і це не спливало,
  # бо всі 198 документів ми ганяли ПАКЕТНО з іншим файлом профілю. Знайдено
  # аналізом готовності до демо (docs/tasks/2026-08-25_demo-readiness-plan.md,
  # розд. 1.1): найголовніший сценарій демо -- завантаження через браузер --
  # читає саме цей профіль.
  model_path: /home/ubuntu/shared/models/mamaylm-27b-q4_k_m.gguf
  # -1 = ВСІ шари на GPU. На ноуті тут 0 (немає CUDA), і саме це давало
  # десятки секунд на виклик; на H100 27B у 4-бітному кванті (16 ГБ) цілком
  # у VRAM (80 ГБ), тож сенсу тримати шари на CPU немає жодного.
  n_gpu_layers: -1
  # На GPU вузьке місце -- не prefill, а кількість викликів. Більший батч
  # полів на один виклик дешевший, ніж кілька викликів.
  batch_size: 8
  # Кілька семплів + голосування: на CPU це було непозичально дорого
  # (кожен семпл -- десятки секунд), на GPU стає реальним варіантом.
  # Лишаємо 1 за замовчуванням: спершу замір, потім вмикання (правило
  # docs/known-weak-spots.md -- без цифри не змінюємо поведінку).
  self_consistency_n: 1
  max_context_chars: 6000

ocr:
  engine: surya
  # Шлях ОБОВ'ЯЗКОВИЙ, і це виправлення 25.08.2026. Тут стояло `null` із
  # коментарем «на Linux surya знайде сама» -- неправда: на цій машині
  # llama.cpp не встановлений системно, і surya падає з
  #     SpawnError: llama-server binary not found
  # Наслідок, заміряний живим завантаженням через браузер: фото виходило
  # `unresolved` за 2.4 с (не «повільно», а НЕ ОБРОБЛЕНО), а docx і pdf при
  # цьому проходили нормально -- тому дірка й виглядала як «усе працює».
  llama_server_path: /home/ubuntu/anya/llamacpp/llama-b10586/llama-server
  # Бекенд ЗАКРІПЛЕНИЙ, а не автовизначений -- навмисно. Автовизначення
  # surya дивиться на «чи є карта», а не «чи карта рахує»: 24.08 на цьому
  # самому сервері vGPU втратив ліцензію, карта в nvidia-smi лишилась, і
  # автовибір узяв vllm, який не піднявся -- кожне фото витрачало 600 с
  # таймауту й виходило unresolved (pipeline/ocr/surya_reader.py, розбір
  # там же). Закріплення означає: якщо карта відпаде знову, ми отримаємо
  # ПОВІЛЬНО, а не ЗІПСОВАНО.
  inference_backend: llamacpp
  inference_parallel: 2
  # 99 = усі шари розпізнавання на GPU (дефолт самої surya). На ноуті ми
  # тримали 0/CPU через нестабільність Vulkan; CUDA на H100 -- інший шлях,
  # і саме він тут очікувано найшвидший.
  n_gpu_layers: 99
  # Кеш промптів внутрішнього llama-server. Лишаємо 0 (наш дефолт): в OCR
  # кожен промпт містить унікальне зображення, влучень у кеш немає за
  # побудовою, а на 80 ГБ VRAM 8 ГіБ кешу -- це просто 8 ГіБ ні за що.
  # Заміряно на ноуті: +145 МБ/фото -> +0 (docs/known-weak-spots.md розд. 2.18).
  cache_ram_mb: 0

storage:
  # Той самий шлях, що output_dir вище -- сховище й вихід мусять збігатися,
  # інакше записи ляжуть в одну папку, а індекс дедуплікації в іншу.
  local_root: data/output-demo

review:
  sample_rate: 20

# Теми нормативного корпусу.
#
# ЩО ЦЕ ТАКЕ І ЧОГО ТУТ НЕМАЄ
#
# Тут перелік ТЕМ, а не мітки документів. Жоден документ у цьому файлі не
# названий: кожен зіставляється з темами автоматично, за словами зі свого
# номера, назви й початку тексту (`chat_gradio/normative_topics.py`).
#
# Так вирішила Аня 28.08, і причина в одному реченні: «нормативні доки ж
# будуть додаватися, тому ти не можеш до них завжди дописувати назви».
# Перша моя версія була саме такою -- 44 ручні мітки -- і вона старіла б із
# кожним новим документом. Тут робота лежить на переліку тем: він міняється
# рідко, а корпус росте вільно.
#
# ЯК ДОДАТИ ТЕМУ
#
# 1. Дописати блок нижче: `title`, `match` (регулярка), `ask` (приклади
#    питань, на які на цьому корпусі СПРАВДІ є відповідь).
# 2. Прогнати `demos/upload_app/tests/test_normative_topics.py`: там
#    перевіряється і те, що регулярка компілюється, і те, що приклади питань
#    мають відповідь у корпусі, і частка «іншого».
#
# ЯК ЦЕ СТАРІЄ І ЧОМУ ЦЕ ВИДНО
#
# Документ, який не ліг ні в одну тему, попадає в «інше» -- і «інше»
# називається числом у самій відповіді чата, а не ховається. Плюс тест падає,
# коли частка «іншого» перевищує `max_other_share`. Тобто застарілий перелік
# тем видно двічі: людині в чаті й наборові тестів.
#
# ПОРЯДОК має значення: документ може попасти в кілька тем (це навмисно --
# питання «про що можна питати» від цього тільки виграє), але в самій
# відповіді теми йдуть у порядку цього файла.

# Частка документів без теми, вище якої набір падає. 0.15 -- не «прийнятна
# якість», а сигнальний поріг: на 28.08 без теми був 1 документ із 44 = 2.3%,
# тобто до порогу є запас, і його перевищення означає «корпус поїхав, а
# перелік тем ні».
max_other_share: 0.15

#: Як називаємо тих, хто не ліг ні в одну тему. Слово «інше» -- навмисно
#: нейтральне: це не «сміття», це «тему ще не описали».
other_title: інше (тему ще не описано)

# ГОТОВІ КНОПКИ на екрані вітання чата (рішення Ані 28.08: приклади питань у
# самій відповіді зайві, натомість три з них -- у дефолтні кнопки).
#
# Перелічені дослівно, а не «перші три теми»: порядок тем у файлі -- це порядок
# ПОКАЗУ тем, і міняти його заради кнопок було б зв'язуванням двох різних
# рішень. Кожне питання мусить бути серед `ask` якоїсь теми -- на це є тест,
# інакше кнопка легко розійшлася б із перевіркою «приклад має відповідь у
# корпусі».
#
# Вибрані саме ці три: відпустка -- бо облік відсутностей і є предмет продукту;
# ВЛК і стягнення -- бо це найчастіші питання «а що мені положено» і «а що за
# це буде», тобто те, по що людина взагалі йде в нормативку.
# ОДНЕ питання, не три (Аня 28.08: скоротити готові кнопки з дев'яти до
# шести). Лишилось про тривалість відпустки: це предмет продукту, і саме на
# ньому працює добір сусіднього пункту за перехресним посиланням -- тобто
# кнопка показує не лише цитату, а й те, що система вміє звести два пункти.
chips:
  - Яка тривалість щорічної основної відпустки

topics:
  - title: захист інформації й таємниця
    match: >-
      захист\w*\s+інформац|ТЗІ|таємниц|персональн\w+\s+дан|доступ\s+до\s+публічн|
      НСД|криптограф|кіберзахист|WEB-стор|ISO.?IEC|службов\w+\s+мереж|
      про\s+інформацію
    ask:
      - Хто відповідає за захист інформації
      - Що таке державна таємниця

  - title: медичне забезпечення й ВЛК
    # Стоїть ВИЩЕ за «проходження служби» навмисно: акти про ВЛК згадують і
    # службу, і контракт, і за порядком першого збігу вони пішли б туди.
    match: >-
      лікарськ\w+\s+експерт|ВЛК|медичн\w+\s+огляд|санітарн|госпітал|
      придатн\w+\s+до\s+військової\s+служби
    ask:
      - Хто проходить військово-лікарську експертизу

  - title: статути, дисципліна, служба в частині
    match: >-
      статут|дисциплінар|стройов|внутрішн\w+\s+служб|гарнізонн|вартов|
      правопорядк
    ask:
      - Які обов'язки чергового
      - Які види дисциплінарних стягнень

  - title: проходження служби, відпустки, мобілізація
    match: >-
      проходженн\w+\s+(?:громадянами|військов)|військов\w+\s+обов|мобілізац|
      воєнн\w+\s+стан|відпуст\w*|контракт\w*\s+про\s+проходження
    ask:
      - Яка тривалість щорічної основної відпустки
      - Хто підписує контракт про проходження військової служби

  - title: облік особового складу й діловодство
    match: >-
      обліку\s+особового|облік\w*\s+особов|діловодств|документуванн|
      номенклатур\w+\s+справ
    ask:
      - Як ведеться облік особового складу

  - title: соціальний захист, пенсії, грошове забезпечення
    match: >-
      соціальн\w+\s+(?:захист|і\s+правов)|пенсійн|ветеран|
      грошов\w+\s+забезпеч|виплат\w*\s+грошов
    ask:
      - Хто має право на пенсію за вислугу років

  - title: майно, форма одягу, техніка
    match: >-
      форм\w+\s+одягу|автомобільн\w+\s+транспорт|дизель-генератор|
      технічн\w+\s+паспорт|речов\w+\s+забезп
    ask:
      - Які правила носіння військової форми одягу

  - title: оборона й національна безпека
    match: >-
      оборон\w+\s+Україн|національн\w+\s+безпек|Збройні\s+Сили\s+Україн|
      Кримінальн\w+\s+кодекс
    ask:
      - Що таке оборона України

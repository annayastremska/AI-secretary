<!-- Той самий шолом, але для <img>: аватар у стрічці чата й іконка сторінки.
     Чому окремий файл, а не той самий: у mark.svg колір -- currentColor, і це
     правильно для ІНЛАЙНОВОГО svg (успадковує колір тексту). Але <img
     src="...svg"> -- окремий документ, який нічого не наслідує: currentColor
     там стає типовим чорним, і в стрічці чата знак виходив сірою плямою
     (зауваження Ані 27.08: «десь стара, а десь взагалі немає»).
     Тут колір явний, і під фігурою -- світле коло: Gradio ріже аватар у круг,
     і без власного кола шолом висів у порожнечі. Криси залишаються в межах
     кола, інакше круг їх обрізає. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="16" fill="#e7ecdd" />
  <g transform="translate(16 15.6) scale(0.76) translate(-16 -15.6)"
     fill="#3a4a2e">
    <path d="M4.6 17.2a11.4 11.4 0 0 1 22.8 0z" />
    <rect x="2.2" y="17.9" width="27.6" height="3.4" rx="1.7" />
    <path d="M7.4 22.1h2.9l1.5 4.1a1.35 1.35 0 0 1-2.5 1z" />
    <path d="M24.6 22.1h-2.9l-1.5 4.1a1.35 1.35 0 0 0 2.5 1z" />
  </g>
</svg>

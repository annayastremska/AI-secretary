<!-- Той самий шолом, але для <img>: шапка звичайних сторінок, іконка сторінки
     (favicon) і аватар у стрічці чата.

     Чому окремий файл, а не той самий mark.svg: там колір це currentColor, і
     це правильно для ІНЛАЙНОВОГО svg (успадковує колір тексту). Але
     <img src="…svg"> це окремий документ, який нічого не наслідує:
     currentColor стає типовим чорним, і на темній оливовій смузі знак зникав.
     Тут колір явний. Під фігурою світле коло: Gradio ріже аватар у круг, і без
     власного кола шолом висів у порожнечі.

     УВАГА, пастка, на якій я двічі втратила іконку 27.08: у коментарі
     SVG-файла НЕ МОЖЕ бути двох дефісів підряд. Це XML, а в XML «‑‑» усередині
     коментаря заборонено: браузер не парсить документ і показує порожнє місце
     замість картинки. Мовчки, без жодної помилки в консолі мережі: файл
     віддається з кодом 200, просто не малюється. Інлайном у чаті той самий
     знак працював, бо там його розбирає парсер HTML, який це терпить, і саме
     тому здавалось, ніби «в одному місці є, в інших немає». У наших коментарях
     подвійний дефіс це звичайне тире, тому в SVG замість нього тільце довге
     тире або двокрапка. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>AI-секретар</title>
  <circle cx="16" cy="16" r="16" fill="#e7ecdd" />
  <g transform="translate(16 15.6) scale(0.76) translate(-16 -15.6)"
     fill="#3a4a2e">
    <path d="M4.6 17.2a11.4 11.4 0 0 1 22.8 0z" />
    <rect x="2.2" y="17.9" width="27.6" height="3.4" rx="1.7" />
    <path d="M7.4 22.1h2.9l1.5 4.1a1.35 1.35 0 0 1-2.5 1z" />
    <path d="M24.6 22.1h-2.9l-1.5 4.1a1.35 1.35 0 0 0 2.5 1z" />
  </g>
</svg>

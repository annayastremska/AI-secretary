<!-- Знак продукту: бойовий шолом, фронтальний силует.
     Було: контурний купол + рядки документа під ним. З першого погляду це
     читалось як настільна лампа (зауваження Ані 27.08) -- рядки документа
     давали «підставку», а тонкий контур не тримав форму на 16-24px.
     Стало: ЗАЛИТА фігура з трьох частин -- купол, ширші за купол криси й два
     підборідні ремені. Саме криси, ширші за купол, роблять шолом шоломом:
     без них будь-яка півкуля читається як купол лампи.
     Один колір, currentColor, без градієнтів -- працює і на 16px, і на 64px,
     і на світлій, і на темній темі. Для <img> (аватар у стрічці чата, іконка
     сторінки) є mark-avatar.svg: там колір мусить бути явний, бо currentColor
     в окремому документі нічого не наслідує. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"
     fill="currentColor" aria-hidden="true">
  <!-- купол -->
  <path d="M4.6 17.2a11.4 11.4 0 0 1 22.8 0z" />
  <!-- криси: ширші за купол -->
  <rect x="2.2" y="17.9" width="27.6" height="3.4" rx="1.7" />
  <!-- підборідні ремені -->
  <path d="M7.4 22.1h2.9l1.5 4.1a1.35 1.35 0 0 1-2.5 1z" />
  <path d="M24.6 22.1h-2.9l-1.5 4.1a1.35 1.35 0 0 0 2.5 1z" />
</svg>

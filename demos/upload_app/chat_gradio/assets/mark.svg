<!-- Знак продукту: кевларовий шолом у профіль.
     Чому шолом: у стенді Колі він був, і це справді читається з першого
     погляду -- «це система військової частини», без жодного слова. Наш варіант
     не копія: до шолома додано рядок документа під козирком (три штрихи), бо
     продукт саме про документи, а не про бій.
     Одна фігура, currentColor, без градієнтів -- читається на 16px і на 64px,
     і однаково працює на світлій і темній темі. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none"
     stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true">
  <!-- купол -->
  <path d="M5.4 17.6a10.6 10.6 0 0 1 21.2 0" />
  <!-- підборідний обвід і потилиця -->
  <path d="M26.6 17.6c0 1.7-.5 2.7-1.6 3.2l-3.1 1.3" />
  <path d="M5.4 17.6c0 2.4 1.2 3.6 3.6 3.6h3.2" />
  <!-- козирок -->
  <path d="M3.6 17.6h24.8" />
  <!-- рядок документа під козирком: те, чим система займається -->
  <path d="M12.4 25h9.2" opacity=".95" />
  <path d="M12.4 28.4h5.6" opacity=".65" />
</svg>

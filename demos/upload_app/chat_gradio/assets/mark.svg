<!-- Знак продукту: бойовий шолом, фронтальний силует. ІНЛАЙНОВА версія
     (колір це currentColor, успадковує колір тексту). Для <img> є
     mark-avatar.svg з явним кольором.

     Було: контурний купол плюс рядки документа під ним. З першого погляду це
     читалось як настільна лампа: рядки документа давали «підставку», а тонкий
     контур не тримав форму на 16‑24px.
     Стало: ЗАЛИТА фігура з трьох частин, купол, ширші за купол криси й два
     підборідні ремені. Саме криси, ширші за купол, роблять шолом шоломом: без
     них будь‑яка півкуля читається як купол лампи.

     У коментарі SVG не може бути двох дефісів підряд: це XML, і такий файл
     мовчки не парситься при видачі через <img>. Розбір у mark-avatar.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"
     fill="currentColor" aria-hidden="true">
  <!-- купол -->
  <path d="M4.6 17.2a11.4 11.4 0 0 1 22.8 0z" />
  <!-- криси: ширші за купол -->
  <rect x="2.2" y="17.9" width="27.6" height="3.4" rx="1.7" />
  <!-- підборідні ремені -->
  <path d="M7.4 22.1h2.9l1.5 4.1a1.35 1.35 0 0 1-2.5 1z" />
  <path d="M24.6 22.1h-2.9l-1.5 4.1a1.35 1.35 0 0 0 2.5 1z" />
</svg>

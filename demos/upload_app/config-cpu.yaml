# Профіль сервера БЕЗ РОБОЧОГО GPU (24.08.2026).
#
# Навіщо окремий файл. На сервері vGPU H100-80C втратив ліцензію
# (`nvidia-smi -q` -> `License Status: Unlicensed`), і CUDA-обчислення зникли:
# `torch.zeros(1).cuda()` дає `operation not supported`, а llama.cpp падає з
# SIGABRT ще на реєстрації CUDA-бекенда -- НЕЗАЛЕЖНО від `n_gpu_layers`.
# Деталі й що потрібно від адміністраторів -- docs/tasks/2026-08-24_control-run-results.md
# розд. 4.
#
# Цей профіль дає повний прогін БЕЗ GPU. Заміряно 24.08.2026:
#   * фото (OCR через llamacpp на CPU): 47 с на кадр -- проти ~23 с на GPU;
#   * виклик 27B на CPU: 43 с -- проти секунд на GPU. Терпимо, бо на
#     впізнаному бланку модель не викликається зовсім.
#
# ГОЛОВНЕ, чого тут не видно з самих значень: запускати треба з
# `CUDA_VISIBLE_DEVICES=`. Інакше llama.cpp реєструє CUDA-бекенд і падає ще
# до першого шару. Тобто цей файл -- половина рішення, друга половина в
# оточенні:
#
#     CUDA_VISIBLE_DEVICES= python run_pipeline.py --config demos/upload_app/config-cpu.yaml --input <...>
#

paths:
  input_dir: data/inbox
  # ОКРЕМИЙ вихід для демо-набору, і це не косметика: у базу віддається вміст
  # РІВНО цієї папки. `data/output/` лишається для наших тестових прогонів --
  # там осідає все, що ми колись проганяли, включно зі старим корпусом
  # LEAVE/TRIP, чиї люди зі штаткою не сходяться. Якби обидва писали в одне
  # місце, «що вантажити в базу» довелося б відбирати очима по 150 файлах.
  output_dir: data/output-demo

intake:
  archive: true
  processed_dir: data/processed
  failed_dir: data/failed

llm:
  enabled: true
  # Ваги кладе `python pipeline/scripts/download_model.py` -- саме сюди.
  # Абсолютний шлях: ваги у СПІЛЬНІЙ теці (~/shared/models), не в клоні.
  model_path: /home/ubuntu/shared/models/mamaylm-27b-q4_k_m.gguf
  # -1 = ВСІ шари на GPU. На ноуті тут 0 (немає CUDA), і саме це давало
  # десятки секунд на виклик; на H100 12B у 4-бітному кванті цілком у VRAM
  # (~7 ГБ з 80), тож сенсу тримати шари на CPU немає жодного.
  n_gpu_layers: 0        # GPU недоступний, див. шапку
  # На GPU вузьке місце -- не prefill, а кількість викликів. Більший батч
  # полів на один виклик дешевший, ніж кілька викликів.
  batch_size: 8
  # Кілька семплів + голосування: на CPU це було непозичально дорого
  # (кожен семпл -- десятки секунд), на GPU стає реальним варіантом.
  # Лишаємо 1 за замовчуванням: спершу замір, потім вмикання (правило
  # docs/known-weak-spots.md -- без цифри не змінюємо поведінку).
  self_consistency_n: 1
  max_context_chars: 6000

ocr:
  engine: surya
  # Бекенд ОГОЛОШЕНО, не вгадується: автовизначення surya дивиться лише на
  # `nvidia-smi -L`, тобто на НАЯВНІСТЬ карти, і при неліцензованому vGPU
  # обирало vllm -- той не піднімався, і кожне фото коштувало 600 с таймауту
  # й виходило unresolved.
  inference_backend: llamacpp
  # На Linux surya сама збирає/знаходить llama-server; абсолютний шлях
  # потрібен лише на Windows. null = не підказувати.
  llama_server_path: /home/ubuntu/anya/llamacpp/llama-b10586/llama-server
  inference_parallel: 2
  # 99 = усі шари розпізнавання на GPU (дефолт самої surya). На ноуті ми
  # тримали 0/CPU через нестабільність Vulkan; CUDA на H100 -- інший шлях,
  # і саме він тут очікувано найшвидший.
  n_gpu_layers: 0
  # Кеш промптів внутрішнього llama-server. Лишаємо 0 (наш дефолт): в OCR
  # кожен промпт містить унікальне зображення, влучень у кеш немає за
  # побудовою, а на 80 ГБ VRAM 8 ГіБ кешу -- це просто 8 ГіБ ні за що.
  # Заміряно на ноуті: +145 МБ/фото -> +0 (docs/known-weak-spots.md розд. 2.18).
  cache_ram_mb: 0

storage:
  # Той самий шлях, що output_dir вище -- сховище й вихід мусять збігатися,
  # інакше записи ляжуть в одну папку, а індекс дедуплікації в іншу.
  local_root: data/output-demo

review:
  sample_rate: 20

<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-секретар</title>
<style>
  /* Все локально: жодних CDN, шрифтів, аналітики. Системні шрифти. */
  :root {
    --ink: #1a1e24; --muted: #5c6672; --line: #d9dee5; --bg: #f4f6f8;
    --card: #ffffff; --accent: #1f6feb;
    --ok-bg: #e6f4ea; --ok-ink: #1e6e3e;
    --warn-bg: #fdf3d7; --warn-ink: #8a6d00;
    --info-bg: #e8f0fe; --info-ink: #1a56b0;
    --pending-bg: #fbe9e0; --pending-ink: #a04a12;
    --err-bg: #fdecea; --err-ink: #b3261e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.35rem; margin: 0 0 18px; }
  section { background: var(--card); border: 1px solid var(--line);
            border-radius: 10px; padding: 16px 20px; margin-bottom: 14px; }
  h2 { font-size: 0.8rem; margin: 0 0 10px; color: var(--muted);
       text-transform: uppercase; letter-spacing: 0.05em; }
  /* Зона завантаження: велика, одна первинна дія */
  .dropzone { display: block; border: 2px dashed var(--line); border-radius: 10px;
              padding: 42px 20px; text-align: center; cursor: pointer;
              color: var(--muted); font-size: 1.05rem; transition: border-color .15s, background .15s; }
  .dropzone:hover, .dropzone:focus-within, .dropzone.drag { border-color: var(--accent);
              background: var(--info-bg); color: var(--info-ink); }
  .dropzone input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .dropzone .big { font-weight: 600; color: var(--ink); display: block; margin-bottom: 4px; }
  .dropzone.disabled { pointer-events: none; opacity: 0.55; }
  /* Степер: компактний, лише стан і таймер */
  ol.stepper { list-style: none; margin: 0; padding: 0; display: flex;
               flex-wrap: wrap; gap: 8px 22px; }
  ol.stepper li { display: flex; align-items: center; gap: 8px; }
  .dot { flex: none; width: 20px; height: 20px; border-radius: 50%;
         display: inline-flex; align-items: center; justify-content: center;
         font-size: 11px; border: 2px solid var(--line); color: var(--muted);
         background: #fff; }
  li.done .dot { border-color: var(--ok-ink); background: var(--ok-bg); color: var(--ok-ink); }
  li.running .dot { border-color: var(--accent); color: var(--accent); }
  li.failed .dot { border-color: var(--err-ink); background: var(--err-bg); color: var(--err-ink); }
  li.pendingstep { opacity: 0.5; }
  .stepname { font-weight: 600; }
  .steptime { color: var(--muted); font-variant-numeric: tabular-nums; }
  li.running .steptime { color: var(--accent); font-weight: 600; }
  .spin { display: inline-block; width: 11px; height: 11px; border-radius: 50%;
          border: 2px solid var(--accent); border-top-color: transparent;
          animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { color: var(--muted); font-size: 0.88rem; margin: 10px 0 0; }
  /* Статуси */
  .badge { display: inline-block; padding: 3px 12px; border-radius: 999px;
           font-size: 0.9rem; font-weight: 600; }
  .badge.confirmed { background: var(--ok-bg); color: var(--ok-ink); }
  .badge.needs_review { background: var(--warn-bg); color: var(--warn-ink); }
  .badge.duplicate, .badge.unchanged { background: var(--info-bg); color: var(--info-ink); }
  .badge.unresolved { background: var(--pending-bg); color: var(--pending-ink); }
  .badge.error { background: var(--err-bg); color: var(--err-ink); }
  .next { margin: 8px 0 0; }
  .note { border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 0.92rem; }
  .note.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .note.info { background: var(--info-bg); color: var(--info-ink); }
  .note.pending { background: var(--pending-bg); color: var(--pending-ink); }
  .note.err { background: var(--err-bg); color: var(--err-ink); }
  /* Таблиці полів */
  .tablewrap { overflow-x: auto; margin-top: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line);
           vertical-align: top; }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.gap { color: var(--muted); font-style: italic; }
  td.src { color: var(--muted); white-space: nowrap; }
  h3 { font-size: 0.95rem; margin: 16px 0 2px; }
  /* Кнопки */
  button { font: inherit; padding: 10px 22px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--line); background: #fff; }
  button.primary { background: var(--accent); border-color: var(--accent);
                   color: #fff; font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  details { margin-top: 12px; }
  details > summary { cursor: pointer; color: var(--muted); font-size: 0.88rem; }
  pre.log { background: #f0f2f5; border-radius: 8px; padding: 10px;
            overflow-x: auto; font-size: 0.78rem; max-height: 240px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>AI-секретар</h1>

  <section>
    <label class="dropzone" id="dropzone">
      <span class="big">Перетягніть файл документа сюди</span>
      або натисніть, щоб обрати (фото, скан, docx, pdf)
      <input type="file" id="file"
             accept=".docx,.pdf,.jpg,.jpeg,.png,.tif,.tiff,.webp,.bmp">
    </label>
    <div id="upload-error"></div>
  </section>

  <section id="progress-sec" class="hidden">
    <h2>Обробка <span id="filename"></span></h2>
    <ol class="stepper" id="stepper" aria-live="polite"></ol>
    <p class="hint hidden" id="ocr-hint">Розпізнавання фото триває до кількох хвилин.</p>
    <div id="pipeline-error"></div>
    <details id="log-details" class="hidden"><summary>Технічні деталі обробки</summary>
      <pre class="log" id="pipeline-log"></pre></details>
  </section>

  <section id="review-sec" class="hidden">
    <h2>Витягнуто з документа</h2>
    <div id="status-line" aria-live="polite"></div>
    <div id="review-body"></div>
    <p style="margin-top:16px">
      <button class="primary" id="commit-btn">Записати в базу</button>
    </p>
  </section>

  <section id="db-sec" class="hidden">
    <h2>Запис у базу</h2>
    <div id="db-body" aria-live="polite"></div>
  </section>
</main>

<script>
"use strict";
const STEP_ORDER = ["upload", "pipeline", "db"];
const STEP_LABELS = { upload: "Завантаження", pipeline: "Обробка", db: "Запис у базу" };
const SUBJECT_LABELS = {
  rank: "Звання", surname: "Прізвище", given_name: "Ім'я",
  patronymic: "По батькові", person_alias: "Повне ім'я (як піде в реєстр осіб)",
};
/* Короткі стани + один рядок «що далі». Технічні причини — у розгортуваному блоці. */
const STATUS_VIEW = {
  confirmed:    { label: "Підтверджено",        next: "Можна записувати в базу." },
  needs_review: { label: "Потребує перевірки",  next: "Запишеться як непідтверджене й стане в чергу перевірки людиною." },
  unresolved:   { label: "Не розпізнано",       next: "У базу піде лише сам документ і позначка для ручного розбору." },
  duplicate:    { label: "Уже оброблявся",      next: "Нижче — наявний запис; повторний запис у базу не створить копію." },
};

let currentJob = null, pollTimer = null, stepStarted = null;
const $ = (id) => document.getElementById(id);

/* Зона завантаження: вибір або перетягування = старт обробки */
const dz = $("dropzone");
$("file").addEventListener("change", () => {
  if ($("file").files.length) startUpload($("file").files[0]);
});
["dragover", "dragenter"].forEach(ev => dz.addEventListener(ev, e => {
  e.preventDefault(); dz.classList.add("drag");
}));
["dragleave", "drop"].forEach(ev => dz.addEventListener(ev, e => {
  e.preventDefault(); dz.classList.remove("drag");
}));
dz.addEventListener("drop", e => {
  if (e.dataTransfer.files.length) startUpload(e.dataTransfer.files[0]);
});

async function startUpload(file) {
  const fd = new FormData();
  fd.append("file", file);
  dz.classList.add("disabled");
  resetView();
  let resp, data;
  try {
    resp = await fetch("/api/upload", { method: "POST", body: fd });
    data = await resp.json();
  } catch (err) {
    showError("upload-error", "Сервер недоступний: " + err);
    dz.classList.remove("disabled");
    return;
  }
  if (!resp.ok) {
    showError("upload-error", data.error || resp.statusText);
    dz.classList.remove("disabled");
    return;
  }
  currentJob = data.job_id;
  /* id у URL: перезавантаження сторінки посеред довгого розпізнавання не
     губить прогрес — задача живе на сервері */
  history.replaceState(null, "", "?job=" + currentJob);
  $("filename").textContent = "— " + file.name;
  $("progress-sec").classList.remove("hidden");
  stepStarted = {};
  pollTimer = setInterval(poll, 1000);
  poll();
}

/* Відновлення після перезавантаження сторінки */
window.addEventListener("DOMContentLoaded", () => {
  const jobParam = new URLSearchParams(location.search).get("job");
  if (!jobParam) return;
  currentJob = jobParam;
  stepStarted = {};
  $("progress-sec").classList.remove("hidden");
  pollTimer = setInterval(poll, 1000);
  poll();
});

function resetView() {
  ["progress-sec", "review-sec", "db-sec", "log-details", "ocr-hint"]
    .forEach(id => $(id).classList.add("hidden"));
  ["stepper", "review-body", "db-body", "status-line", "pipeline-error", "upload-error"]
    .forEach(id => $(id).innerHTML = "");
}

function showError(id, msg) {
  const el = $(id);
  el.innerHTML = "";
  el.appendChild(note("err", msg));
}

async function poll() {
  if (!currentJob) return;
  let resp, job;
  try {
    resp = await fetch("/api/jobs/" + currentJob);
    job = await resp.json();
  } catch { return; } /* тимчасовий збій мережі — наступний тік догоне */
  if (!resp.ok) return;
  renderSteps(job);
  renderLog(job);
  $("ocr-hint").classList.toggle("hidden",
    !(job.is_image && job.state === "pipeline_running"));

  if (job.state === "ready_for_review") {
    renderReview(job);
  } else if (job.state === "committed") {
    renderReview(job);
    renderDbResult(job);
    stopPolling();
  } else if (job.state === "pipeline_failed") {
    showError("pipeline-error", "Збій обробки: " + (job.error || "невідома причина"));
    dz.classList.remove("disabled");
    stopPolling();
  } else if (job.state === "commit_failed") {
    renderReview(job);
    $("db-sec").classList.remove("hidden");
    $("db-body").innerHTML = "";
    $("db-body").appendChild(note("err", job.error || "запис не вдався"));
    $("commit-btn").disabled = false;  /* можна повторити після підняття бази */
    stopPolling();
  }
}

function stopPolling() {
  clearInterval(pollTimer);
  pollTimer = null;
  dz.classList.remove("disabled");
}

function renderSteps(job) {
  const ol = $("stepper");
  ol.innerHTML = "";
  const byName = {};
  for (const s of job.steps) byName[s.name] = s;
  for (const name of STEP_ORDER) {
    const step = byName[name];
    if (!step && name === "db" && !job.db_result && job.state !== "committing") {
      /* крок запису ще не настав — показуємо тьмяним */
      ol.appendChild(stepLi("pendingstep", "○", name, "", ""));
      continue;
    }
    if (!step) continue;
    const time = step.seconds != null ? fmtSec(step.seconds)
      : step.state === "running"
        ? (stepStarted[name] || (stepStarted[name] = Date.now()),
           fmtSec((Date.now() - stepStarted[name]) / 1000))
        : "";
    const mark = step.state === "done" ? "✓" : step.state === "failed" ? "✕"
      : '<span class="spin" role="img" aria-label="виконується"></span>';
    ol.appendChild(stepLi(step.state, mark, name, time));
  }
}

function stepLi(cls, mark, name, time) {
  const li = document.createElement("li");
  li.className = cls;
  const dot = document.createElement("span");
  dot.className = "dot"; dot.innerHTML = mark;
  const nm = document.createElement("span");
  nm.className = "stepname"; nm.textContent = STEP_LABELS[name] || name;
  const tm = document.createElement("span");
  tm.className = "steptime"; tm.textContent = time || "";
  li.append(dot, nm, tm);
  return li;
}

function fmtSec(s) {
  s = Math.round(s);
  return s >= 60 ? Math.floor(s / 60) + " хв " + (s % 60) + " с" : s + " с";
}

function renderLog(job) {
  const text = [(job.pipeline_stdout || ""), (job.pipeline_stderr || "")]
    .filter(Boolean).join("\n--- stderr ---\n");
  if (text) {
    $("pipeline-log").textContent = text;
    $("log-details").classList.remove("hidden");
  }
}

function renderReview(job) {
  $("review-sec").classList.remove("hidden");
  const p = job.preview;
  if (!p) return;
  const shownStatus = job.duplicate_upload ? "duplicate" : p.status;
  const view = STATUS_VIEW[shownStatus] || { label: shownStatus, next: "" };

  const line = $("status-line");
  line.innerHTML = "";
  const badge = document.createElement("span");
  badge.className = "badge " + shownStatus;
  badge.textContent = view.label;
  line.appendChild(badge);
  if (view.next) {
    const nx = document.createElement("p");
    nx.className = "next"; nx.textContent = view.next;
    line.appendChild(nx);
  }

  const body = $("review-body");
  body.innerHTML = "";

  /* Суб'єкт */
  const subj = p.subject || {};
  if (Object.keys(subj).length) {
    body.appendChild(h3("Про кого документ"));
    const rows = [];
    for (const key of ["rank", "surname", "given_name", "patronymic"]) {
      let v = subj[key];
      if (v && typeof v === "object") v = v.label || v.code;
      rows.push([SUBJECT_LABELS[key], v, sourceOf(p, key)]);
    }
    body.appendChild(fieldTable(["Поле", "Значення", "Джерело"], rows));
    if (subj.person_complete === false)
      body.appendChild(note("warn", "Неповне ім'я — запис особи в базу не пройде."));
  }

  /* Факти */
  const labels = p.fact_labels || {};
  if (p.facts.length) {
    body.appendChild(h3("Факти"));
    const rows = p.facts.map(f => [
      labels[f.fact_type] || f.fact_type,
      [f.value_code == null ? null : String(f.value_code),
       [f.date_start, f.date_end].filter(Boolean).join(" — ")]
        .filter(Boolean).join("  ·  ") || null,
      f.confirmed ? "підтверджено" : "потребує перевірки",
    ]);
    body.appendChild(fieldTable(["Поле", "Значення", "Стан"], rows));
  } else {
    body.appendChild(note("pending", "Фактів не витягнуто — у базу піде лише сам документ."));
  }

  /* Прогалини */
  const gaps = [];
  for (const f of p.unknown_critical_fields) gaps.push([f, "не знайдено — обов'язкове поле"]);
  for (const f of p.unknown_fields)
    if (!p.unknown_critical_fields.includes(f)) gaps.push([f, "не знайдено"]);
  for (const f of p.confirmed_empty_fields) gaps.push([f, "порожньо в самому документі"]);
  if (gaps.length) {
    body.appendChild(h3("Прогалини"));
    body.appendChild(fieldTable(["Поле", "Стан"], gaps, true));
  }

  /* Технічні деталі — згорнуто за замовчуванням */
  const tech = [];
  if (p.reason) tech.push("Причина: " + p.reason);
  if (p.review_reason) tech.push("Причина перевірки: " + p.review_reason);
  if (p.review_queue) tech.push("Черга перевірки: " + p.review_queue);
  if (p.template) tech.push("Шаблон: " + p.template + " · домен: " + p.domain);
  if (p.ocr_blocks != null)
    tech.push("Розпізнавання: " + p.ocr_blocks + " блоків, " + p.ocr_chars + " символів");
  if (p.date_range_error) tech.push("Суперечливі дати: " + p.date_range_error);
  for (const [f, problem] of Object.entries(p.consistency_problems))
    tech.push(f + ": " + problem);
  for (const w of p.warnings) tech.push(w);
  if (tech.length) {
    const det = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = "Технічні деталі";
    det.appendChild(sum);
    const pre = document.createElement("pre");
    pre.className = "log";
    pre.textContent = tech.join("\n");
    det.appendChild(pre);
    body.appendChild(det);
  }

  $("commit-btn").disabled = !(job.state === "ready_for_review" || job.state === "commit_failed");
}

function sourceOf(p, field) {
  const prov = (p.field_provenance || {})[field];
  if (!prov) return "";
  const src = prov.method === "matched" ? "з тексту документа"
    : prov.method === "llm" ? "модель"
    : prov.method === "no_value" ? "" : prov.method || "";
  return src + (prov.resolved === false ? " · не зіставлено з довідником" : "");
}

function renderDbResult(job) {
  $("db-sec").classList.remove("hidden");
  const body = $("db-body");
  body.innerHTML = "";
  const r = job.db_result;
  if (!r) return;
  if (r.doc_state === "unchanged") {
    body.appendChild(note("info", "Цей документ уже в базі під номером " +
      r.document_id + " — копію не створено."));
    return;
  }
  const labels = (job.preview && job.preview.fact_labels) || {};
  let msg = "Документ у базі під номером " + r.document_id;
  msg += r.facts_inserted.length
    ? ", записано фактів: " + r.facts_inserted.length + "."
    : ", без фактів.";
  body.appendChild(note("info", msg));
  if (r.doc_state === "reprocessed")
    body.appendChild(note("info", "Повторна обробка: попередня версія фактів позначена застарілою."));
  const st = job.preview && job.preview.status;
  if (st === "needs_review")
    body.appendChild(note("warn", "Факти записані як непідтверджені й документ у черзі перевірки — у підсумки вони не входять, доки людина не підтвердить."));
  if (st === "unresolved")
    body.appendChild(note("pending", "Документ позначено для ручного розбору."));
  if (r.facts_inserted.length) {
    const det = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = "Що саме записано";
    det.appendChild(sum);
    const wrap = fieldTable(["Поле", "№ запису"],
      r.facts_inserted.map(([t, id]) => [labels[t] || t, String(id)]));
    det.appendChild(wrap);
    body.appendChild(det);
  }
}

/* дрібні хелпери DOM */
function note(cls, msg) { const d = document.createElement("div");
  d.className = "note " + cls; d.textContent = msg; return d; }
function h3(t) { const h = document.createElement("h3"); h.textContent = t; return h; }
function fieldTable(headers, rows, gapsTable) {
  const wrap = document.createElement("div"); wrap.className = "tablewrap";
  const tbl = document.createElement("table");
  const trh = document.createElement("tr");
  for (const h of headers) { const th = document.createElement("th");
    th.textContent = h; trh.appendChild(th); }
  tbl.appendChild(trh);
  for (const row of rows) {
    const tr = document.createElement("tr");
    row.forEach((cell, i) => {
      const td = document.createElement("td");
      if (cell == null || cell === "") {
        if (i === 1 && !gapsTable) { td.textContent = "не знайдено"; td.className = "gap"; }
      } else {
        td.textContent = cell;
        if (gapsTable && i === 1) td.className = "gap";
      }
      if (i >= 2) td.className += " src";
      tr.appendChild(td);
    });
    tbl.appendChild(tr);
  }
  wrap.appendChild(tbl);
  return wrap;
}

$("commit-btn").addEventListener("click", async () => {
  if (!currentJob) return;
  $("commit-btn").disabled = true;
  await fetch("/api/jobs/" + currentJob + "/commit", { method: "POST" });
  if (!pollTimer) pollTimer = setInterval(poll, 1000);
});
</script>
</body>
</html>

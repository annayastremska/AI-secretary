<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-секретар</title>
<style>
  /* Все локально: жодних CDN, шрифтів, аналітики. Стиль — той самий, що
     на сторінці завантаження (спільна шапка «AI-секретар»). */
  :root {
    --ink: #1a1e24; --muted: #5c6672; --line: #d9dee5; --bg: #f4f6f8;
    --card: #ffffff; --accent: #1f6feb;
    --info-bg: #e8f0fe; --info-ink: #1a56b0;
    --err-bg: #fdecea; --err-ink: #b3261e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 120px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 1.35rem; margin: 0 0 18px; }
  a.nav { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
  a.nav:hover { text-decoration: underline; }
  /* Стрічка повідомлень */
  #feed { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .msg { max-width: 92%; border-radius: 12px; padding: 10px 14px;
         white-space: pre-wrap; overflow-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff;
              border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--card);
             border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.bot details { margin-top: 8px; }
  .msg.bot summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }
  .msg.bot pre { background: #f0f2f5; border-radius: 8px; padding: 8px 10px;
                 overflow-x: auto; font-size: 0.78rem; margin: 6px 0 0;
                 white-space: pre-wrap; }
  .msg .time { display: block; margin-top: 6px; color: var(--muted);
               font-size: 0.78rem; }
  .msg.pending { color: var(--muted); font-style: italic; }
  /* Кнопки-приклади */
  #examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  #examples button { font: inherit; font-size: 0.88rem; padding: 7px 12px;
                     border-radius: 999px; border: 1px solid var(--line);
                     background: var(--card); cursor: pointer; }
  #examples button:hover { border-color: var(--accent); color: var(--accent); }
  #examples button:disabled { opacity: 0.5; cursor: not-allowed; }
  /* Ввід */
  form#ask { display: flex; gap: 8px; }
  #q { flex: 1; font: inherit; padding: 10px 14px; border-radius: 10px;
       border: 1px solid var(--line); background: var(--card); }
  #q:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  #send { font: inherit; padding: 10px 22px; border-radius: 10px; cursor: pointer;
          border: 1px solid var(--accent); background: var(--accent); color: #fff;
          font-weight: 600; }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  .note { border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 0.92rem;
          background: var(--err-bg); color: var(--err-ink); }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>AI-секретар</h1>
    <a class="nav" href="/">Завантажити документ</a>
  </header>

  <div id="feed"></div>

  <div id="examples">
    <button type="button">Скільки людей зараз у відпустці?</button>
    <button type="button">Хто був у відпустці у травні 2026?</button>
    <button type="button">Хто був у відрядженні у травні 2026?</button>
    <button type="button">Що відомо про Усика?</button>
    <button type="button">Покажи документ № 109</button>
    <button type="button">Скільки документів чекають перевірки?</button>
  </div>

  <form id="ask">
    <input id="q" type="text" autocomplete="off"
           placeholder="Питання про відпустки, відрядження, документи…">
    <button id="send" type="submit">Спитати</button>
  </form>
  <div id="error"></div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let busy = false;

function addMsg(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;   /* лише textContent — жодного HTML з даних */
  $("feed").appendChild(div);
  div.scrollIntoView({ block: "end" });
  return div;
}

function renderAnswer(div, data) {
  div.classList.remove("pending");
  div.textContent = data.text || "(порожня відповідь)";
  /* Джерело/SQL — прогресивне розкриття: у згортці, не в тілі відповіді */
  if (data.source && data.source.length) {
    const det = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = "джерело";
    det.appendChild(sum);
    const pre = document.createElement("pre");
    pre.textContent = data.source.join("\n");
    det.appendChild(pre);
    div.appendChild(det);
  }
  const t = document.createElement("span");
  t.className = "time";
  t.textContent = data.elapsed_s + " с";
  div.appendChild(t);
}

async function ask(question) {
  if (busy || !question.trim()) return;
  busy = true;
  setDisabled(true);
  $("error").innerHTML = "";
  addMsg("user", question);
  const pending = addMsg("bot pending", "шукаю відповідь…");
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || resp.statusText);
    renderAnswer(pending, data);
  } catch (err) {
    pending.remove();
    const note = document.createElement("div");
    note.className = "note";
    note.textContent = "Сервер недоступний: " + err.message;
    $("error").appendChild(note);
  } finally {
    busy = false;
    setDisabled(false);
    $("q").focus();
  }
}

function setDisabled(v) {
  $("send").disabled = v;
  $("q").disabled = v;
  for (const b of $("examples").querySelectorAll("button")) b.disabled = v;
}

$("ask").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("q").value;
  $("q").value = "";
  ask(q);
});
$("examples").addEventListener("click", (e) => {
  if (e.target.tagName === "BUTTON") ask(e.target.textContent);
});
</script>
</body>
</html>

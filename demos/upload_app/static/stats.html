<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content: при появі клавіатури
     браузер зменшує САМ вьюпорт, тому притиснуте до низу поле не
     ховається під нею й нічого не треба рахувати в JS. -->
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Статистика — AI-секретар</title>
<!-- Обличчя спільне з чатом: токени + шар звичайних сторінок. Жодного CDN,
     зовнішнього шрифта чи аналітики (перевірка №7 у README апки). -->
<!-- Обличчя одним посиланням: яку версію віддати, вирішує
     сервер за APP_THEME (v1 -- як було, v2 -- строга база). -->
<link rel="icon" href="/static/mark-avatar.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/skin.css">
<!-- Перемикач теми ставить data-theme ДО першого малювання, тому скрипт стоїть
     у <head> і БЕЗ defer: інакше сторінка блимнула б світлою й перефарбувалась
     у темну, а ця мить читається як поломка. -->
<script src="/static/theme-toggle.js"></script>
<!-- Рівень доступу: людина мусить бачити свою межу ДО того, як
     натисне кнопку, а не дізнатися про неї з відмови. -->
<script src="/static/access.js" defer></script>
<!-- Телефонна розкладка: висота під клавіатуру й шухляда. -->
<script src="/static/mobile.js" defer></script>
</head>
<body>
<header class="appbar">
  <a class="brand" href="/">
    <img src="/static/mark-avatar.svg" alt="">
    <span>
      <span class="brand-name">AI-секретар</span><br>
      <span class="brand-sub">облік особового складу</span>
    </span>
  </a>
  <nav>
    <a href="/">Завантажити документ</a>
    <a href="/stats" aria-current="page">Статистика</a>
    <a href="/chat">Чат</a>
  </nav>
  <!-- Перемикач стоїть у брендовій смузі праворуч, а не в підвалі: це
       налаштування вигляду, і шукають його там, де вигляд і живе. Порожня
       навмисно -- іконку й підписи ставить theme-toggle.js, щоб три сторінки
       не тримали три копії трьох SVG. -->
  <button type="button" class="theme-toggle" data-mode="system"
          aria-label="Тема"></button>
</header>

<main>
  <h1>Статистика</h1>
  <p class="lede">Стан бази, з якої чат бере відповіді, і виміряна якість
    обробки.</p>

  <div id="db-error"></div>

  <section id="db-sec">
    <h2>База зараз</h2>
    <div class="tiles" id="db-tiles"></div>
    <p class="hint" id="db-types"></p>
    <p class="hint" id="queue-note"></p>
  </section>

  <!-- Робота чата стоїть ПЕРЕД виміряною якістю пайплайна навмисно: людина
       приходить на сторінку після розмови з чатом, і перше питання в неї про
       чат, а не про витяг полів. -->
  <section id="chat-sec">
    <h2>Робота чата</h2>
    <div class="tiles" id="chat-live-tiles"></div>
    <div class="tiles" id="chat-quality-tiles"></div>
  </section>

  <section id="quality-sec">
    <h2>Виміряна якість обробки</h2>
    <div class="tiles" id="quality-tiles"></div>
    <p class="hint" id="quality-note"></p>
  </section>

  <p class="asof" id="asof"></p>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

/* Порядок плиток задає код сторінки, а не порядок ключів у JSON: «чернетки»
   мусять стояти поруч із «підтвердженими» і мати свій колір -- це і є
   правило продукту, показане оком. */
function tile(num, label, note, cls) {
  const d = document.createElement("div");
  d.className = "tile" + (cls ? " " + cls : "");
  const n = document.createElement("div");
  n.className = "tile-num"; n.textContent = num == null ? "—" : String(num);
  const l = document.createElement("div");
  l.className = "tile-label"; l.textContent = label;
  d.append(n, l);
  if (note) {
    const s = document.createElement("div");
    s.className = "tile-note"; s.textContent = note;
    d.appendChild(s);
  }
  return d;
}

/* Пігулка стану: та сама роль, що в кольору плитки, але видна ФОРМОЮ.
   Нащо дублювати колір формою: на проєкторі й на телефоні відтінки сідають,
   а підпис у рамці лишається читним. */
function pill(text, cls) {
  const s = document.createElement("span");
  s.className = "pill" + (cls ? " " + cls : "");
  s.textContent = text;
  return s;
}

/* Плитка з пігулкою замість дрібного підпису знизу. */
function stateTile(num, label, pillText, cls) {
  const d = tile(num, label, null, cls);
  d.appendChild(pill(pillText, cls ? cls.replace("tile--", "pill--") : null));
  return d;
}

/* Головне число розділу: той самий будівельник, інший розмір. Ієрархія
   робиться КЛАСОМ, а не окремою розміткою -- інакше два способи зробити
   плитку розійдуться на першій правці. */
function heroTile(num, label, note, cls) {
  const d = tile(num, label, note, cls);
  d.classList.add("tile--hero");
  return d;
}

function note(cls, msg) {
  const d = document.createElement("div");
  d.className = "note " + cls; d.textContent = msg; return d;
}

function kvList(map, labels) {
  const dl = document.createElement("dl");
  dl.className = "kv";
  const keys = Object.keys(map || {});
  if (!keys.length) {
    const p = document.createElement("p");
    p.className = "hint"; p.textContent = "порожньо";
    return p;
  }
  for (const k of keys.sort((a, b) => map[b] - map[a])) {
    const row = document.createElement("div");
    const dt = document.createElement("dt");
    dt.textContent = (labels && labels[k]) ? labels[k] + " (" + k + ")" : k;
    const dd = document.createElement("dd");
    dd.textContent = String(map[k]);
    row.append(dt, dd);
    dl.appendChild(row);
  }
  return dl;
}

/* ЖИВІ числа. Оновлюються самі, поки сторінка відкрита: у цьому й сенс --
   людина ставить питання в чаті, вертається на статистику й бачить, що
   медіана поїхала. Числа з пам'яті процесу, тому після перезапуску сервісу
   вони починаються з нуля -- і на екрані так і написано. */
function renderChatLive(m) {
  const host = $("chat-live-tiles");
  host.textContent = "";
  if (!m || !m.n) {
    /* Порожній стан, який КАЖЕ, ЩО РОБИТИ (дрібниця 7). Прочерк без
       пояснення -- тупик: людина не знає, це поломка чи просто немає даних. */
    const box = document.createElement("div");
    box.className = "empty";
    const b = document.createElement("b");
    b.textContent = "Ще не міряли";
    box.appendChild(b);
    box.appendChild(document.createTextNode(
      "Лічильник заповнюється з першого питання в чаті "
      + "і рахує з моменту запуску сервісу."));
    host.appendChild(box);
    return;
  }
  /* Медіана, а не середнє: правила відповідають за 0.04 с, модель за 3-45 с,
     і одна довга відповідь задирає середнє так, що воно перестає описувати
     хоч що-небудь. Найгірші 10% -- окремим числом, поруч. */
  const hero = heroTile(m.median_s + " с", "медіана часу відповіді",
                        "половина відповідей швидше, половина довше");
  /* Крихітний графік (дрібниця 4): одне число каже «зараз», графік -- «і так
     було весь час». Дані вже є, лічильник тримає останні ходи. */
  const spark = sparkline(m.series);
  if (spark) { hero.appendChild(spark); }
  host.append(
    hero,
    tile(m.p90_s + " с", "найгірші 10%", "9 з 10 відповідей швидші за це"),
    tile(m.total, "питань з запуску сервісу"));
  /* РЯДКА «Дороги: …» ТУТ БІЛЬШЕ НЕМА (Аня 27.08). Він друкував внутрішні
     назви доріг разом із технічним іменем шаблону -- «каталог шаблонів
     (roster_total)». Це запис для нас, а не для людини, яка дивиться цифри:
     назовні воно читається як помилка. Розклад по дорогах лишається там, де
     він потрібен, -- у сліді ходу (`trace_lookup.py --stats`). */
}

/* Спарклайн без жодної бібліотеки: точок мало, а зовнішніх запитів зі
   сторінок у нас не буває взагалі. Малюємо в координатах viewBox і тягнемо
   на всю ширину -- тому preserveAspectRatio="none".
   Шкала ЛОГАРИФМІЧНА: 0.04 с і 45 с на лінійній шкалі дають лінію по нулю з
   одним шпилем, тобто графік, який нічого не показує. */
function sparkline(series) {
  if (!series || series.length < 3) { return null; }
  const W = 200, H = 30, PAD = 3;
  const ys = series.map((v) => Math.log10(Math.max(v, 0.01)));
  const lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
  const span = (hi - lo) || 1;
  const pts = ys.map((y, i) => {
    const x = (i / (ys.length - 1)) * W;
    return [x, H - PAD - ((y - lo) / span) * (H - PAD * 2)];
  });
  const d = pts.map((pt, i) => (i ? "L" : "M")
    + pt[0].toFixed(1) + " " + pt[1].toFixed(1)).join(" ");
  const last = pts[pts.length - 1];
  /* Збираємо розміткою, а не createElementNS. Причина не в стилі: для
     createElementNS потрібен рядок із адресою простору імен SVG, а такий
     рядок на нашій сторінці зайвий -- перевірка «нічого з CDN» шукає адреси
     в тексті сторінки й не може відрізнити простір імен від запиту. Не
     послаблювати перевірку заради зручності: браузер розбирає svg у
     innerHTML із правильним простором імен сам. */
  const wrap = document.createElement("div");
  wrap.innerHTML = '<svg class="spark" viewBox="0 0 ' + W + " " + H
    + '" preserveAspectRatio="none" aria-hidden="true">'
    + '<path d="' + d + '" fill="none" stroke="var(--c-accent)"'
    + ' stroke-width="1.4" vector-effect="non-scaling-stroke" />'
    + '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1)
    + '" r="2.2" fill="var(--c-accent)" />'
    + "</svg>";
  return wrap.firstChild;
}

/* СТАЛІ числа: внутрішній замір приладами на фіксованому тест-сеті, без
   участі живих людей. Змінюються лише коли прилад перезапустили -- тому й
   стоять окремим рядком плиток і мають дату заміру в підписі. */
function renderChatQuality(cq) {
  const host = $("chat-quality-tiles");
  host.textContent = "";
  if (!cq) { return; }
  const r = cq.router, c = cq.catalog;
  if (c) {
    /* Найсуворіша з наших мірок: цифра, яку чат називає людині, звірена з
       незалежним підрахунком по файлах пайплайна. Не «схоже» -- те саме. */
    /* Підпис «із ПРАВИЛЬНИМ числом» обіцяв більше, ніж прилад міряє: він
       звіряє базу з ВЛАСНИМ виводом пайплайна (.md-записами), а не з
       правдою. Якщо витяг помилився однаково в базі й у файлі -- перевірка
       зелена. Тому «узгоджених із записами пайплайна». */
    /* ПІДПИС СКОРОЧЕНО (Аня 27.08: «підписи інтуїтивно зрозумілі без
       контексту й коротші»). Було: «100% шаблонів узгоджені із записами
       пайплайна · 34 з 34 звірок (25 порівнюють число, 9 — виконання й
       відмови) · звірено 2026-08-27 16:15:55» -- чотири факти в одному
       рядку, з яких людині потрібен один: цифри в чаті збігаються з
       документами. Головним числом тепер «34 з 34», а не «100%»: дріб
       показує, скільком перевірок було, тобто наскільком твердження велике.
       Розклад 25/6/3 і час до секунди -- у data/eval/*.json і в
       `verify_catalog.py --json`. Дата лишається, бо це ЗАМІР, а не живе
       число, і без дати вона претендувала б на «зараз». */
    /* ДАТИ В ПЛИТЦІ БІЛЬШЕ НЕМА (Аня 27.08: «дату залиш ЛИШЕ внизу»). Вона
       переїхала в нижній рядок сторінки, разом із часом зняття живих чисел --
       і саме там їй місце: сталі числа мусять бути позначені як замір, але
       двічі на екрані дата стає шумом. */
    host.appendChild(tile(
      c.matched + " з " + c.checks,
      "перевірок чат проходить",
      "цифри у відповідях збігаються з обробленими документами",
      c.failures ? "tile--pending" : "tile--ok"));
  }
  if (r) {
    /* ВІДСОТКА ТУТ БІЛЬШЕ НЕМА, і це навмисно. Було «100% питань розпізнано
       правильно» -- найсильніше твердження на сторінці й найслабше під ним:
       відсоток рахувався по ШЕСТИ питаннях зі 124 (решту або ловлять правила,
       або вони свідомо йдуть у модель). Глядач читав це як «чат розуміє все».

       Замість відсотка -- число, яке справді цінне й правдиве: скільком
       разів ярус помилився ВПЕВНЕНО. Впевнена помилка гірша за фолбек, бо
       фолбек усе одно дасть правильну відповідь; тому нуль тут -- сильне
       твердження, і його можна показувати без сорому. */
    /* ПІДПИС СКОРОЧЕНО (Аня 27.08). «Впевнено-неправильний маршрут» -- наш
       внутрішній термін; людині потрібне те саме простіше: швидкий шар або
       зрозумів питання, або передав його моделі, і жодного разу не зрозумів
       неправильно. Друге речення лишається, бо без нього «0 помилок на 54
       питаннях» -- перебільшення: шар узяв шість, решту свідомо не брав. */
    /* ДРІБ, А НЕ САМОТНІЙ НУЛЬ (Аня 27.08). «0» без знаменника не каже, з
       чого нуль: нуль помилок на нулі спроб і нуль на шести -- різні
       твердження. Знаменник -- скільком питань швидкий шар узяв САМ
       (`routed`), а не весь тест-сет: на решті він свідомо промовчав, і
       ставити її в знаменник означало б приписати собі чужу роботу.
       Пояснення -- одним реченням про те, ЩО це таке, бо термін наш. */
    host.appendChild(tile(
      r.confidently_wrong + "/" + r.routed,
      "помилок швидкого розпізнавання",
      "швидке розпізнавання — відповідь за схожістю з уже відомими "
      + "питаннями, без моделі",
      r.confidently_wrong ? "tile--pending" : "tile--ok"));
  }
  /* Цитати з нормативки: мірка є в ланцюгу Андрія, але поки не рахується.
     Прочерк БЕЗ причини гірший за відсутність плитки, тому причина -- у
     підписі плитки, а не в документації. */
  host.appendChild(tile("—", "підходящих цитат із норм-актів",
                        "ще не міряємо", "tile--draft"));
  /* Службового рядка під сталими числами тут БІЛЬШЕ НЕМА (Аня 27.08:
     «прибери це все з сайту»). У ньому злиплись чотири різні речі: причина
     розбіжностей, дві дати заміру, назва encoder-а й заблокований доступ до
     чужої схеми. Це записи для команди, а не для людини, яка дивиться цифри.
     Живуть вони там, де їм і місце: у файлах заміру data/eval/*.json, у
     docs/tasks і в комітах. Плитки говорять самі за себе. */
}

function block(title, node) {
  const wrap = document.createElement("div");
  const h = document.createElement("h3");
  h.textContent = title;
  wrap.append(h, node);
  return wrap;
}

/* Живі числа оновлюємо окремим ЛЕГКИМ маршрутом, а не повним /api/stats:
   той робить сім запитів у Postgres, і смикати чужу базу кожні кілька секунд
   заради секундоміра ми не будемо (база -- зона Андрія). Тут читання з
   пам'яті процесу. */
const LIVE_EVERY_MS = 5000;

async function pollLive() {
  try {
    const resp = await fetch("/api/chat-live");
    if (resp.ok) { renderChatLive(await resp.json()); }
  } catch (err) {
    /* Мовчки: сторінка не мусить сипати помилками через один невдалий
       опит. Числа просто лишаються попередніми. */
  }
}

/* Скелет (дрібниця 6). Сторінка до відповіді сервера була порожня, потім
   стрибком заповнювалась. Смужки на місці майбутніх чисел показують, СКІЛЬКИ
   буде даних і де вони стануть, тому поява перестає бути стрибком. */
function skeleton() {
  for (const id of ["db-tiles", "chat-live-tiles", "chat-quality-tiles",
                    "quality-tiles"]) {
    const host = $(id);
    if (!host) { continue; }
    host.textContent = "";
    for (let i = 0; i < 3; i += 1) {
      const cell = document.createElement("div");
      cell.className = "tile";
      const n = document.createElement("div");
      n.className = "skel skel--num";
      const l = document.createElement("div");
      l.className = "skel skel--w2";
      cell.append(n, l);
      host.appendChild(cell);
    }
  }
}

async function load() {
  skeleton();
  let data;
  try {
    const resp = await fetch("/api/stats");
    data = await resp.json();
  } catch (err) {
    $("db-error").appendChild(note("err",
      "Сторінка не змогла отримати цифри: " + err));
    return;
  }
  render(data);
  setInterval(pollLive, LIVE_EVERY_MS);
}

function render(data) {
  /* СПЕРШУ ЗНЯТИ СКЕЛЕТ, і лише потім малювати.
     Мій же дефект 27.08, знайдений Анею: `render()` плитки ДОДАЄ (`append`),
     а не заміняє. Тому сірі заготовки лишались на місці, їхня анімація
     крутилась далі -- і розділ «База зараз» виглядав так, ніби вантажиться й
     ніколи не догрузиться, хоч цифри вже прийшли й були домальовані нижче.
     Прибирати мусить той, хто малює: інакше кожен новий розділ повторить це. */
  for (const id of ["db-tiles", "chat-live-tiles", "chat-quality-tiles",
                    "quality-tiles"]) {
    const host = $(id);
    if (host) { host.textContent = ""; }
  }
  /* ЄДИНЕ МІСЦЕ З ДАТАМИ на сторінці (Аня 27.08: «дату залиш ЛИШЕ внизу»).
     Дві дати, і вони про різне: `collected_at` -- коли ЦЯ сторінка прочитала
     базу (тобто живі числа), а дата заміру -- коли останній раз ганяли
     прилади (сталі числа). Друга обов'язкова саме тому, що з плиток її
     прибрали: без неї «34 з 34» претендувало б на «зараз». */
  const measured = [(data.chat_quality || {}).catalog,
                    (data.chat_quality || {}).router]
    .map((x) => (x || {}).measured_at).filter(Boolean).sort().pop();
  $("asof").textContent = "Цифри зняті "
    + (data.collected_at || "").replace("T", " ")
    + (measured ? " · сталі числа — із заміру приладів "
                  + measured.slice(8, 10) + "." + measured.slice(5, 7) : "");

  /* База недоступна -- так і сказано; жодних нулів замість чисел, бо нуль
     означав би «у базі порожньо», а це інша річ. */
  if (!data.db_available) {
    $("db-tiles").classList.add("hidden");
    $("db-sec").appendChild(note("err",
      "База недоступна — цифр показати не можу. " +
      "Причина: " + (data.db_error || "невідома") +
      ". Це не «нуль у базі»: невідомо."));
  } else {
    const d = data.documents, f = data.facts, q = data.review_queue;
    /* Головне число розділу -- підтверджені факти: саме вони і є те, з чого
       чат складає відповіді. Решта поруч і дрібніше. */
    /* СЛОВО «ПІДТВЕРДЖЕНИЙ» ТУТ БІЛЬШЕ НЕ ВЖИВАЄТЬСЯ (рішення Ані 27.08).
       У базі `facts.status='confirmed'` означає «пайплайн витягнув упевнено»,
       а НЕ «людина підтвердила»: у таблиці немає ні `confirmed_by`, ні
       `confirmed_at` -- людське підтвердження там нема де зберігати. Плитка ж
       стояла під підписом «підтверджених» поруч із «чернетками, які не в
       підрахунку», і читалась як «ці факти пройшли людську перевірку».
       Пігулка називає джерело прямо. */
    const personnel = (d.by_domain || {});
    const personnelDocs = (personnel.leave || 0) + (personnel.deployment || 0);
    $("db-tiles").append(
      heroTile(f.confirmed, "фактів витягнуто впевнено",
               "входять у підрахунки", "tile--ok"),
      stateTile(f.unconfirmed, "чернеток", "непевне поле, не в підрахунку",
                "tile--draft"),
      /* Пігулки «чекає людини» тут БІЛЬШЕ НЕМА: число взято з
         `people.service_id IS NULL`, а черга -- інша множина (відкритих
         завдань «нова особа» чотири, і одне з них застаріле). Змішувати два
         в одній плитці означало б стверджувати зв'язок, якого в схемі немає. */
      /* ПІДПИС КАЖЕ ПРИЧИНУ (Аня 27.08: «це досі так? хіба не виправили?»).
         Число живе й правильне, але старий підпис читався як недоробка. Троє
         розібрані по одному в `docs/tasks/2026-08-26_people-not-in-roster.md`:
         один -- НАВМИСНИЙ виняток набору (DEMO-17, рівно щоб показати чергу
         рев'ю), двоє -- розбіжність поколінь даних (у документі «Швайко», у
         штатці «Швайка»; «Дутка Адам» без по батькові). Помилки витягу серед
         них немає жодної, тому «виправляти» тут нічого -- це стан даних, і
         сторінка мусить його називати, а не приховувати. */
      stateTile(q.people_unmatched, "осіб не зійшлися зі штаткою",
                "один навмисно — для показу черги", "tile--pending"),
      /* «204 документи» поруч із фактами читалось як «кадрові документи, які
         система обробила». Насправді там ще 44 нормативні акти й штатка. */
      tile(d.total, "документів усього",
           personnelDocs ? personnelDocs + " з них кадрові" : null),
      tile(data.people, "осіб у реєстрі"));

    /* Типи документів -- одним рядком, без таблиці: на сторінці потрібне
       основне, а не всі розкладки (правка Ані 25.08). */
    const labels = data.labels.domain || {};
    const parts = Object.entries(d.by_domain || {})
      .sort((a, b) => b[1] - a[1])
      .map(([k, v]) => (labels[k] || k) + " " + v);
    $("db-types").textContent = parts.length
      ? "Типи документів: " + parts.join(" · ")
      : "";

    /* Два числа поруч плутають, якщо не сказати різницю (питання Ані 26.08):
       чернетки -- про ДАНІ (факт непевний), черга -- про РОБОТУ (що людині
       перевірити). Вони перетинаються лише частково. */
    const qt = data.labels.queue || {}, byType = q.by_type || {};
    const queueParts = Object.entries(byType)
      .sort((a, b) => b[1] - a[1])
      .map(([k, v]) => (qt[k] || k) + " " + v);
    /* `open_total` -- журнал завдань, і більшість його записів створена до
       появи штатки (система відмічала кожне нове прізвище). Тому головним
       числом стоїть «не зійшлися зі штаткою», а журнал -- поруч, дрібним. */
    $("queue-note").textContent = queueParts.length
      /* Коротко (зауваження Ані 27.08): на екрані -- два числа, які
         відповідають на питання «скільком роботи людині». Розбір, чому
         завдань більше за документи, -- у документації. */
      /* `documents_pending`, а НЕ `..._substantive`. Фільтр «крім нової
         особи» писався 26.08, коли таких завдань було 133 старих. Андрій їх
         закрив, лишилось чотири -- і фільтр перестав прибирати шум, а почав
         приховувати три живі документи. */
      ? (q.documents_pending ?? "—") + " документів чекає людини" +
        " · усього завдань у черзі " + q.open_total
      : "";
  }

  renderChatLive(data.chat_live);
  renderChatQuality(data.chat_quality);

  /* Виміряна якість: одна головна цифра (частка правильно витягнутих полів
     проти заздалегідь відомої відповіді) плюс те, що її підпирає. */
  const qm = data.quality;
  if (!qm) {
    $("quality-sec").appendChild(note("err",
      "Цифри якості не читаються: " + (data.quality_error || "невідомо")));
  } else {
    /* ПЛИТКИ «100% полів витягнуто правильно» ТУТ БІЛЬШЕ НЕМА (рішення Ані
       27.08). Вона читала `eval/baseline.json` -- файл ОЧІКУВАНИХ цифр, проти
       якого щодня йде перевірка «не ламає». У ньому «правильних полів» =
       «усіх полів» за побудовою, тому плитка не могла показати не-100%
       НІКОЛИ, навіть якби пайплайн зламався сьогодні. Плюс знаменник був
       подвоєний: `leave` і `leave_pdf` -- ті самі 16 документів у двох
       форматах, тобто 47 документів рахувались як 82.

       Живий замір цих цифр -- окрема робота після демо; тоді плитка
       вернеться, але вже з фактичним результатом і справжньою датою. */
    $("quality-tiles").append(
      tile(qm.normative_ok + "/" + qm.normative_total,
           "нормативних класифіковано",
           "тип документа визначено правильно"),
      /* «Базова лінія», а не «проходить»: це теж очікувані цифри з того
         самого файла, а не результат прогону. Теперішній час стверджував
         факт про зараз. */
      /* ПІДПИС СКОРОЧЕНО (Аня 27.08). Було «падає 0 · 1 відкладений: вердикт
         "наш бланк" поки лише так/ні» -- назва конкретного відкладеного тесту
         нічого не каже тому, хто не читав код. Важливі дві речі: нічого не
         падає, і один тест відкладений НАВМИСНО (це не приховане падіння). */
      /* «Нічого не падає» прибрано (Аня 27.08): дріб 299 з 300 це вже каже.
         Лишилось те, чого з дробу не видно, -- що різниця не падіння, а
         навмисно відкладений тест. Який саме -- у передачі Андрію. */
      tile(qm.tests_passed + " з " + qm.tests_total,
           "тестів пайплайна проходить",
           "один тест відкладено навмисно"));
    /* РЯДКА «Заміряно ‹дата›» БІЛЬШЕ НЕМА. Це був `mtime` файла базової
       лінії, тобто час, коли файл останній раз потрапив на диск -- зазвичай
       `git pull`. Доказ: файл змінено 06:47:37, а коміт, який його приніс,
       зроблено за 62 секунди до цього. Дата виглядала свіжою, будучи
       мертвою, і оновлювалась би сама від кожного оновлення репозиторію. */
    /* Одне речення (Аня 27.08). Друга половина -- «це не свіжий замір, живий
       замір робиться приладом окремо» -- пояснювала НАШ порядок роботи, а не
       цифру на екрані. Те, що цифри з базової лінії, вже сказано першим
       реченням; решта -- у документації. */
    $("quality-note").textContent =
      "Цифри, проти яких щодня йде перевірка «не ламає».";
  }
}

load();
</script>
</body>
</html>

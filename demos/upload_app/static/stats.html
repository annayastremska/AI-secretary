<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content: при появі клавіатури
     браузер зменшує САМ вьюпорт, тому притиснуте до низу поле не
     ховається під нею й нічого не треба рахувати в JS. -->
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Статистика — AI-секретар</title>
<!-- Обличчя спільне з чатом: токени + шар звичайних сторінок. Жодного CDN,
     зовнішнього шрифта чи аналітики (перевірка №7 у README апки). -->
<!-- Обличчя одним посиланням: яку версію віддати, вирішує
     сервер за APP_THEME (v1 -- як було, v2 -- строга база). -->
<link rel="icon" href="/static/mark-avatar.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/skin.css">
<!-- Перемикач теми ставить data-theme ДО першого малювання, тому скрипт стоїть
     у <head> і БЕЗ defer: інакше сторінка блимнула б світлою й перефарбувалась
     у темну, а ця мить читається як поломка. -->
<script src="/static/theme-toggle.js"></script>
<!-- Рівень доступу: людина мусить бачити свою межу ДО того, як
     натисне кнопку, а не дізнатися про неї з відмови. -->
<script src="/static/access.js" defer></script>
<!-- Телефонна розкладка: висота під клавіатуру й шухляда. -->
<script src="/static/mobile.js" defer></script>
</head>
<body>
<header class="appbar">
  <a class="brand" href="/">
    <img src="/static/mark-avatar.svg" alt="">
    <span>
      <span class="brand-name">AI-секретар</span><br>
      <span class="brand-sub">облік особового складу</span>
    </span>
  </a>
  <nav>
    <a href="/">Завантажити документ</a>
    <a href="/stats" aria-current="page">Статистика</a>
    <a href="/chat">Чат</a>
  </nav>
  <!-- Перемикач стоїть у брендовій смузі праворуч, а не в підвалі: це
       налаштування вигляду, і шукають його там, де вигляд і живе. Порожня
       навмисно -- іконку й підписи ставить theme-toggle.js, щоб три сторінки
       не тримали три копії трьох SVG. -->
  <button type="button" class="theme-toggle" data-mode="system"
          aria-label="Тема"></button>
</header>

<main>
  <h1>Статистика</h1>
  <p class="lede">Стан бази, з якої чат бере відповіді, і виміряна якість
    обробки.</p>

  <div id="db-error"></div>

  <section id="db-sec">
    <h2>База зараз</h2>
    <div class="tiles" id="db-tiles"></div>
    <p class="hint" id="db-types"></p>
    <p class="hint" id="queue-note"></p>
  </section>

  <!-- Робота чата стоїть ПЕРЕД замірами навмисно: людина приходить на сторінку
       після розмови з чатом, і перше питання в неї про чат, а не про витяг
       полів чи про прилади. (Спершу тут було написано «перед виміряною якістю
       пайплайна» -- того розділу з 29.08 немає, а порядок лишився тим самим і
       з тієї ж причини.) -->
  <section id="chat-sec">
    <h2>Робота чата</h2>
    <div class="tiles" id="chat-live-tiles"></div>
    <!-- Другого рядка плиток («сталі числа чата») тут більше немає: усі
         чотири його плитки прибрані 29.08, причини -- у скрипті, на місці
         рендера. Порожній контейнер лишати не можна: він тримає відступ і
         читається як розділ, що не догрузився. -->
  </section>

  <!-- РОЗДІЛУ «ВИМІРЯНА ЯКІСТЬ ОБРОБКИ» ТУТ БІЛЬШЕ НЕМА (Аня 29.08).

       У ньому лишалась одна плитка -- «нормативних класифіковано 41/42», -- і
       вона пішла з двох причин, кожної досить самої:

       1. знаменник ЧУЖОГО віку. 42 -- це набір, на якому колись ганяли замір,
          а в базі нормативних актів уже 44. Підпис цього не казав, тому число
          читалось як «наша якість ЗАРАЗ», хоч описує стан набору;
       2. під числом не було «чим зміряно». Для сталої цифри це порушення
          нашого ж правила «цифра без джерела не показується» -- того самого,
          за яким метрики Андрія без поля `how` на сторінку не пускаються.

       Виміряна якість зі сторінки не зникла: вона внизу, у розділі «Замір
       бази й нормативного пошуку», де в кожної цифри є прилад і дата. Коли
       класифікацію переміряють на живому корпусі, плитка вернеться -- уже з
       живим знаменником і з «чим зміряно». -->

  <!-- Замір бази й нормативного пошуку. Окремий розділ, а не спільні плитки:
       знаменники тут інші НАВМИСНО. «База зараз» рахує всі документи (205 на
       29.08), а Андрій міряє 134 із 153 -- лише ті, з яких узялися факти.
       Поставити ці числа поруч без підпису означало б зробити обидва
       непояснюваними; тому в кожного тут своє «чим зміряно».
       (Приклад «у нас 179 із 204» із першої версії цього коментаря прибрано
       29.08: плитки, на яку він посилався, на сторінці більше немає.) -->
  <section id="partner-sec">
    <h2>Замір бази й нормативного пошуку</h2>
    <div class="tiles" id="partner-tiles"></div>
    <p class="hint" id="partner-note"></p>
  </section>

  <!-- Перетини відсутностей однієї особи. Пропозиція Андрія 28.08.

       Чому тут ДВА числа, а не одне «конфліктів: N». Із двох наявних пар одна
       законна: наказ №118 анульований, №131 виданий замість нього. Назвати це
       конфліктом означало б показати гостям неправду про власні дані. Тому
       перше число -- «пар, що перетинаються» (факт), а друге -- скільком
       записана підстава заміни (те, що відрізняє заміну від суперечності).

       Окремої сторінки навмисно немає: перелік розкривається тут же. -->
  <section id="conflict-sec">
    <h2>Конфлікти: перетини відсутностей</h2>
    <div class="tiles" id="conflict-tiles"></div>
    <div id="conflict-list"></div>
    <p class="hint" id="conflict-note"></p>
  </section>

  <p class="asof" id="asof"></p>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

/* Порядок плиток задає код сторінки, а не порядок ключів у JSON: «чернетки»
   мусять стояти поруч із «підтвердженими» і мати свій колір -- це і є
   правило продукту, показане оком. */
function tile(num, label, note, cls) {
  const d = document.createElement("div");
  d.className = "tile" + (cls ? " " + cls : "");
  const n = document.createElement("div");
  n.className = "tile-num"; n.textContent = num == null ? "—" : String(num);
  const l = document.createElement("div");
  l.className = "tile-label"; l.textContent = label;
  d.append(n, l);
  if (note) {
    const s = document.createElement("div");
    s.className = "tile-note"; s.textContent = note;
    d.appendChild(s);
  }
  return d;
}

/* Пігулка стану: та сама роль, що в кольору плитки, але видна ФОРМОЮ.
   Нащо дублювати колір формою: на проєкторі й на телефоні відтінки сідають,
   а підпис у рамці лишається читним. */
function pill(text, cls) {
  const s = document.createElement("span");
  s.className = "pill" + (cls ? " " + cls : "");
  s.textContent = text;
  return s;
}

/* Плитка з пігулкою замість дрібного підпису знизу. */
function stateTile(num, label, pillText, cls) {
  const d = tile(num, label, null, cls);
  d.appendChild(pill(pillText, cls ? cls.replace("tile--", "pill--") : null));
  return d;
}

/* Головне число розділу: той самий будівельник, інший розмір. Ієрархія
   робиться КЛАСОМ, а не окремою розміткою -- інакше два способи зробити
   плитку розійдуться на першій правці. */
function heroTile(num, label, note, cls) {
  const d = tile(num, label, note, cls);
  d.classList.add("tile--hero");
  return d;
}

function note(cls, msg) {
  const d = document.createElement("div");
  d.className = "note " + cls; d.textContent = msg; return d;
}

function kvList(map, labels) {
  const dl = document.createElement("dl");
  dl.className = "kv";
  const keys = Object.keys(map || {});
  if (!keys.length) {
    const p = document.createElement("p");
    p.className = "hint"; p.textContent = "порожньо";
    return p;
  }
  for (const k of keys.sort((a, b) => map[b] - map[a])) {
    const row = document.createElement("div");
    const dt = document.createElement("dt");
    dt.textContent = (labels && labels[k]) ? labels[k] + " (" + k + ")" : k;
    const dd = document.createElement("dd");
    dd.textContent = String(map[k]);
    row.append(dt, dd);
    dl.appendChild(row);
  }
  return dl;
}

/* ЖИВІ числа. Оновлюються самі, поки сторінка відкрита: у цьому й сенс --
   людина ставить питання в чаті, вертається на статистику й бачить, що
   медіана поїхала. Числа з пам'яті процесу, тому після перезапуску сервісу
   вони починаються з нуля -- і на екрані так і написано. */
function renderChatLive(m) {
  const host = $("chat-live-tiles");
  host.textContent = "";
  if (!m || !m.n) {
    /* Порожній стан, який КАЖЕ, ЩО РОБИТИ (дрібниця 7). Прочерк без
       пояснення -- тупик: людина не знає, це поломка чи просто немає даних. */
    const box = document.createElement("div");
    box.className = "empty";
    const b = document.createElement("b");
    b.textContent = "Ще не міряли";
    box.appendChild(b);
    box.appendChild(document.createTextNode(
      "Лічильник заповнюється з першого питання в чаті "
      + "і рахує з моменту запуску сервісу."));
    host.appendChild(box);
    return;
  }
  /* Медіана, а не середнє: правила відповідають за 0.04 с, модель за 3-45 с,
     і одна довга відповідь задирає середнє так, що воно перестає описувати
     хоч що-небудь. Найгірші 10% -- окремим числом, поруч. */
  const hero = heroTile(m.median_s + " с", "медіана часу відповіді",
                        "половина відповідей швидше, половина довше");
  /* Крихітний графік (дрібниця 4): одне число каже «зараз», графік -- «і так
     було весь час». Дані вже є, лічильник тримає останні ходи. */
  const spark = sparkline(m.series);
  if (spark) { hero.appendChild(spark); }
  /* НАЙГІРШІ 10% ЛИШАЮТЬСЯ.
     Аня 29.08 відповідала на мій перелік слабких плиток по номерах, і на один
     із них написала: «ні, маєш лишити, щоб розуміти bias медіани». Номер
     указував на «питань з запуску сервісу», а зміст фрази -- на цю плитку;
     я вибрала цю й мусила спитати, а не вирішувати сама. Питання їй
     поставлене; доки відповіді немає, плитка лишається, бо повернути прибране
     дорожче, ніж прибрати лишнє.
     Аргумент, який фразу підтримує, і він мій: медіана САМА
     не каже, чи є довгий хвіст, тому 1.2 с при p90 = 4.0 с і 1.2 с при
     p90 = 1.3 с -- це два різні продукти, а на екрані виглядали б однаково.
     Пара чисел і є мірка розкиду; спарклайн показує форму, але не число.

     Що при цьому треба знати про саме число (не привід прибирати, привід не
     переоцінювати): 90-й процентиль рахується найближчим рангом
     (`livemetrics._percentile`), тому на трьох-чотирьох питаннях він
     ДОРІВНЮЄ максимуму. Тобто на початку демо це «найдовша відповідь», і
     лише з десятків питань -- справді процентиль. Підпис «9 з 10 відповідей
     швидші за це» на малій вибірці трохи обіцяє більше, ніж є, тому це місце
     варто переглянути, коли буде видно, скільком питань набирається за демо. */
  host.append(
    hero,
    tile(m.p90_s + " с", "найгірші 10%", "9 з 10 відповідей швидші за це"));
  /* ПЛИТКА «ПИТАНЬ З ЗАПУСКУ СЕРВІСУ» ПРИБРАНА 29.08 (Аня).
     Лічильник живе в пам'яті процесу, тобто після кожного перезапуску
     показує нуль, а на демо-дні сервіс перезапускають. Число, яке залежить
     від випадкової умови «коли останній раз піднімали апку», не вирішує для
     читача нічого: ні обсягу даних, ні межі надійності. Знаменник, який
     медіані таки потрібен, лишився там, де його читають, -- у порожньому
     стані («лічильник рахує з моменту запуску сервісу»). */
  /* РЯДКА «Дороги: …» ТУТ БІЛЬШЕ НЕМА (Аня 27.08). Він друкував внутрішні
     назви доріг разом із технічним іменем шаблону -- «каталог шаблонів
     (roster_total)». Це запис для нас, а не для людини, яка дивиться цифри:
     назовні воно читається як помилка. Розклад по дорогах лишається там, де
     він потрібен, -- у сліді ходу (`trace_lookup.py --stats`). */
}

/* Спарклайн без жодної бібліотеки: точок мало, а зовнішніх запитів зі
   сторінок у нас не буває взагалі. Малюємо в координатах viewBox і тягнемо
   на всю ширину -- тому preserveAspectRatio="none".
   Шкала ЛОГАРИФМІЧНА: 0.04 с і 45 с на лінійній шкалі дають лінію по нулю з
   одним шпилем, тобто графік, який нічого не показує. */
function sparkline(series) {
  if (!series || series.length < 3) { return null; }
  const W = 200, H = 30, PAD = 3;
  const ys = series.map((v) => Math.log10(Math.max(v, 0.01)));
  const lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
  const span = (hi - lo) || 1;
  const pts = ys.map((y, i) => {
    const x = (i / (ys.length - 1)) * W;
    return [x, H - PAD - ((y - lo) / span) * (H - PAD * 2)];
  });
  const d = pts.map((pt, i) => (i ? "L" : "M")
    + pt[0].toFixed(1) + " " + pt[1].toFixed(1)).join(" ");
  const last = pts[pts.length - 1];
  /* Збираємо розміткою, а не createElementNS. Причина не в стилі: для
     createElementNS потрібен рядок із адресою простору імен SVG, а такий
     рядок на нашій сторінці зайвий -- перевірка «нічого з CDN» шукає адреси
     в тексті сторінки й не може відрізнити простір імен від запиту. Не
     послаблювати перевірку заради зручності: браузер розбирає svg у
     innerHTML із правильним простором імен сам. */
  const wrap = document.createElement("div");
  wrap.innerHTML = '<svg class="spark" viewBox="0 0 ' + W + " " + H
    + '" preserveAspectRatio="none" aria-hidden="true">'
    + '<path d="' + d + '" fill="none" stroke="var(--c-accent)"'
    + ' stroke-width="1.4" vector-effect="non-scaling-stroke" />'
    + '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1)
    + '" r="2.2" fill="var(--c-accent)" />'
    + "</svg>";
  return wrap.firstChild;
}

/* РЯДКА СТАЛИХ ЧИСЕЛ ЧАТА ТУТ БІЛЬШЕ НЕМА ЗОВСІМ (Аня 29.08).

   Він народився як «внутрішній замір приладами на фіксованому тест-сеті» і
   встиг умістити чотири плитки; кожна пішла зі своєю причиною, і остання
   забрала з собою сам рядок разом із розділом-контейнером.

   Що там було і чому нічого не лишилось:
     - «підходящих цитат із норм-актів» -- зашитий прочерк, метрика не
       рахувалась ніколи;
     - «перевірок чат проходить» -- звіряла цифру з чата з підрахунком по
       файлах пайплайна, тобто обидві сторони з одного витягу;
     - «100% питань розпізнано правильно» -- відсоток по шести питаннях зі 124;
     - «помилок швидкого розпізнавання» (нижче) -- підпис не тримався.

   Самі прилади (`verify_catalog.py`, `measure_router.py`) лишаються, і поля
   `chat_quality` лишаються в `/api/stats`: їх читають прилади, а не гості.

   ПЛИТКА «ПОМИЛОК ШВИДКОГО РОЗПІЗНАВАННЯ» (0/5) ПРИБРАНА 29.08 (Аня).
   Її ознака -- саме питання Ані «як це мірялося»: підпис із двох речень уже
   був спробою пояснити те, що не читається з числа. «Швидке розпізнавання»
   -- наш внутрішній ярус, «впевнена помилка» -- наш внутрішній термін, а
   знаменник (скільком питань ярус узяв САМ) без абзацу про порядок ярусів не
   означає нічого. Для гостя на демо-дні це опис нашої кухні, а не стан
   продукту. Нуль там правдивий і лишається в приладі.

   ЗАКОМЕНТОВАНИЙ РЕНДЕР ТУТ НЕ ЛИШЕНО НАВМИСНО: мертвий код виглядає як
   тимчасово вимкнений і повертається сам. Історія рішень -- у цьому
   коментарі й у git. */
function block(title, node) {
  const wrap = document.createElement("div");
  const h = document.createElement("h3");
  h.textContent = title;
  wrap.append(h, node);
  return wrap;
}

/* Живі числа оновлюємо окремим ЛЕГКИМ маршрутом, а не повним /api/stats:
   той робить сім запитів у Postgres, і смикати чужу базу кожні кілька секунд
   заради секундоміра ми не будемо (база -- зона Андрія). Тут читання з
   пам'яті процесу. */
const LIVE_EVERY_MS = 5000;

async function pollLive() {
  try {
    const resp = await fetch("/api/chat-live");
    if (resp.ok) { renderChatLive(await resp.json()); }
  } catch (err) {
    /* Мовчки: сторінка не мусить сипати помилками через один невдалий
       опит. Числа просто лишаються попередніми. */
  }
}

/* Скелет (дрібниця 6). Сторінка до відповіді сервера була порожня, потім
   стрибком заповнювалась. Смужки на місці майбутніх чисел показують, СКІЛЬКИ
   буде даних і де вони стануть, тому поява перестає бути стрибком. */
function skeleton() {
  /* Перелік коротший, ніж був: `chat-quality-tiles` і `quality-tiles`
     прибрані 29.08 разом зі своїми плитками. Мертві id тут не лишаємо --
     на них є тест (`test_every_referenced_id_exists`), і саме він тримає
     правило «прибрали блок -- прибрали й звертання». */
  for (const id of ["db-tiles", "chat-live-tiles"]) {
    const host = $(id);
    if (!host) { continue; }
    host.textContent = "";
    for (let i = 0; i < 3; i += 1) {
      const cell = document.createElement("div");
      cell.className = "tile";
      const n = document.createElement("div");
      n.className = "skel skel--num";
      const l = document.createElement("div");
      l.className = "skel skel--w2";
      cell.append(n, l);
      host.appendChild(cell);
    }
  }
}

async function load() {
  skeleton();
  let data;
  try {
    const resp = await fetch("/api/stats");
    data = await resp.json();
  } catch (err) {
    $("db-error").appendChild(note("err",
      "Сторінка не змогла отримати цифри: " + err));
    return;
  }
  render(data);
  setInterval(pollLive, LIVE_EVERY_MS);
}

function render(data) {
  /* СПЕРШУ ЗНЯТИ СКЕЛЕТ, і лише потім малювати.
     Мій же дефект 27.08, знайдений Анею: `render()` плитки ДОДАЄ (`append`),
     а не заміняє. Тому сірі заготовки лишались на місці, їхня анімація
     крутилась далі -- і розділ «База зараз» виглядав так, ніби вантажиться й
     ніколи не догрузиться, хоч цифри вже прийшли й були домальовані нижче.
     Прибирати мусить той, хто малює: інакше кожен новий розділ повторить це. */
  for (const id of ["db-tiles", "chat-live-tiles"]) {
    const host = $(id);
    if (host) { host.textContent = ""; }
  }
  /* ДАТА ОДНА, і тепер це вся дата, яка сторінці потрібна: `collected_at` --
     коли ЦЯ сторінка прочитала базу.

     ХВОСТА «· сталі числа — із заміру приладів ‹дата›» БІЛЬШЕ НЕМА (29.08).
     Він брався з `chat_quality` і підписував рядок сталих чисел чата -- а
     того рядка на сторінці вже немає. Дата, яка описує прибрані плитки, гірша
     за відсутність дати: вона обіцяє свіжість числам, яких не видно. Сталі
     числа лишились рівно в одному місці -- у метриках Андрія, і там у кожної
     своя дата стоїть під самим числом, у полі «чим зміряно». */
  $("asof").textContent = "Цифри зняті "
    + (data.collected_at || "").replace("T", " ");

  /* База недоступна -- так і сказано; жодних нулів замість чисел, бо нуль
     означав би «у базі порожньо», а це інша річ. */
  if (!data.db_available) {
    $("db-tiles").classList.add("hidden");
    $("db-sec").appendChild(note("err",
      "База недоступна — цифр показати не можу. " +
      "Причина: " + (data.db_error || "невідома") +
      ". Це не «нуль у базі»: невідомо."));
  } else {
    const d = data.documents, f = data.facts, q = data.review_queue;
    /* Головне число розділу -- підтверджені факти: саме вони і є те, з чого
       чат складає відповіді. Решта поруч і дрібніше. */
    /* СЛОВО «ПІДТВЕРДЖЕНИЙ» ТУТ БІЛЬШЕ НЕ ВЖИВАЄТЬСЯ (рішення Ані 27.08).
       У базі `facts.status='confirmed'` означає «пайплайн витягнув упевнено»,
       а НЕ «людина підтвердила»: у таблиці немає ні `confirmed_by`, ні
       `confirmed_at` -- людське підтвердження там нема де зберігати. Плитка ж
       стояла під підписом «підтверджених» поруч із «чернетками, які не в
       підрахунку», і читалась як «ці факти пройшли людську перевірку».
       Пігулка називає джерело прямо. */
    const personnel = (d.by_domain || {});
    const personnelDocs = (personnel.leave || 0) + (personnel.deployment || 0);
    $("db-tiles").append(
      heroTile(f.confirmed, "фактів витягнуто впевнено",
               "входять у підрахунки", "tile--ok"),
      stateTile(f.unconfirmed, "чернеток", "непевне поле, не в підрахунку",
                "tile--draft"),
      /* ПЛИТКА «ОСІБ НЕ ЗІЙШЛИСЯ ЗІ ШТАТКОЮ» (3) ПРИБРАНА 29.08 (Аня).

         Число живе й правильне -- прибрана вона не за брехню, а за адресата.
         Щоб його прочитати, треба знати три речі, яких на сторінці немає:
         що таке штатка, чому особа може бути в документах і не бути в ній, і
         що з трьох один випадок ми зробили НАВМИСНО, щоб показати чергу
         рев'ю. Остання й була видна в пігулці «один навмисно — для показу
         черги»: пігулка, яку доводиться пояснювати, -- це вже не пігулка.
         Для гостя на демо-дні це наша внутрішня кухня.

         Роль, яку плитка справді грала, -- «зробити видимою дірку в даних» --
         на сторінці нікуди не поділась: її грає пара «пар, що перетинаються /
         з них із записаною підставою заміни» внизу, і там дірка видна без
         передзнань. Розбір усіх трьох осіб лишається в
         `docs/tasks/2026-08-26_people-not-in-roster.md`, а число -- у
         `/api/stats` (`review_queue.people_unmatched`), тобто прилади його
         далі читають. */
      /* «204 документи» поруч із фактами читалось як «кадрові документи, які
         система обробила». Насправді там ще 44 нормативні акти й штатка. */
      tile(d.total, "документів усього",
           personnelDocs ? personnelDocs + " з них кадрові" : null),
      tile(data.people, "осіб у реєстрі"));

    /* Типи документів -- одним рядком, без таблиці: на сторінці потрібне
       основне, а не всі розкладки (правка Ані 25.08). */
    const labels = data.labels.domain || {};
    const parts = Object.entries(d.by_domain || {})
      .sort((a, b) => b[1] - a[1])
      .map(([k, v]) => (labels[k] || k) + " " + v);
    $("db-types").textContent = parts.length
      ? "Типи документів: " + parts.join(" · ")
      : "";

    /* Два числа поруч плутають, якщо не сказати різницю (питання Ані 26.08):
       чернетки -- про ДАНІ (факт непевний), черга -- про РОБОТУ (що людині
       перевірити). Вони перетинаються лише частково. */
    const qt = data.labels.queue || {}, byType = q.by_type || {};
    const queueParts = Object.entries(byType)
      .sort((a, b) => b[1] - a[1])
      .map(([k, v]) => (qt[k] || k) + " " + v);
    /* `open_total` -- журнал завдань, і більшість його записів створена до
       появи штатки (система відмічала кожне нове прізвище). Тому першим стоїть
       «документів чекає людини» (скільком папок відкрити), а журнал -- за ним.
       Цей рядок і є тепер єдине місце, де сторінка каже про роботу для людини:
       плитка «осіб не зійшлися зі штаткою» прибрана 29.08. */
    $("queue-note").textContent = queueParts.length
      /* Коротко (зауваження Ані 27.08): на екрані -- два числа, які
         відповідають на питання «скільком роботи людині». Розбір, чому
         завдань більше за документи, -- у документації. */
      /* `documents_pending`, а НЕ `..._substantive`. Фільтр «крім нової
         особи» писався 26.08, коли таких завдань було 133 старих. Андрій їх
         закрив, лишилось чотири -- і фільтр перестав прибирати шум, а почав
         приховувати три живі документи. */
      ? (q.documents_pending ?? "—") + " документів чекає людини" +
        " · усього завдань у черзі " + q.open_total
      : "";
  }

  renderChatLive(data.chat_live);
  /* renderChatQuality() ТУТ БІЛЬШЕ НЕ КЛИЧЕТЬСЯ І САМОЇ ФУНКЦІЇ НЕМА: усі
     чотири плитки сталих чисел чата прибрані (причини -- вище, на місці
     рендера). Поля `chat_quality` в /api/stats лишились -- їх читають прилади.

     БЛОКУ «ВИМІРЯНА ЯКІСТЬ ОБРОБКИ» ТУТ ТАКОЖ БІЛЬШЕ НЕМА (29.08). Він малював
     одну плитку -- «нормативних класифіковано 41/42», -- і вона пішла за
     чужий знаменник (у базі вже 44 акти) і за відсутність «чим зміряно»;
     розклад причин -- у коментарі на місці розділу в розмітці. Разом із
     плиткою пішли розділ, підпис «Цифри, проти яких щодня йде перевірка
     "не ламає"» і повідомлення про непрочитані цифри якості: показувати
     помилку читання того, чого сторінка вже не показує, немає сенсу.
     `data.quality` і `data.quality_error` лишаються в API. */

  renderPartner(data.partner_metrics);
  renderConflicts(data.conflicts);
}

/* ── Замір бази й нормативного пошуку (пакет Андрія) ──────────────────────
   Плитка тут МУСИТЬ нести «чим зміряно»: правило продукту -- цифра без
   джерела не показується. Тому `how` не в підказці й не в атрибуті title
   (його не видно ні на проєкторі, ні на телефоні), а в розкривному блоці
   під числом. */
function metricTile(m) {
  const d = document.createElement("div");
  d.className = "tile";
  const n = document.createElement("div");
  n.className = "tile-num";
  n.textContent = (m.of === null || m.of === undefined || m.of === "")
    ? String(m.value)
    : String(m.value) + " / " + String(m.of);
  const l = document.createElement("div");
  l.className = "tile-label";
  l.textContent = m.name + (m.unit ? " (" + m.unit + ")" : "");
  d.append(n, l);
  const det = document.createElement("details");
  det.className = "how";
  const sum = document.createElement("summary");
  sum.textContent = "чим зміряно";
  const p = document.createElement("div");
  p.className = "tile-note";
  p.textContent = m.how + (m.as_of ? " · замір " + m.as_of : "");
  det.append(sum, p);
  d.appendChild(det);
  return d;
}

/* Плитка «Конфлікти».

   Головне тут -- НЕ показати нуль, коли не зміряно. `pairs === null` означає
   недоступну базу, і нуль на цьому місці читався б як «усе чисто», тобто
   рівно навпаки до правди.

   Друге за важливістю -- КОЖЕН підпис є цілою фразою. Перша версія складала
   речення з уламків, і тест повноти перекладу впав по праву: «ще» і «) і №»
   перекласти неможливо, тобто англійська сторінка вийшла б напівукраїнською.
   Тому пара показується двома рядками замість одного зі сполучниками. */
function renderConflicts(c) {
  const host = $("conflict-tiles");
  if (!host) { return; }
  host.textContent = "";
  $("conflict-list").textContent = "";
  $("conflict-note").textContent = "";
  if (!c) { return; }

  const HOW_SUPERSESSION = "це перетини, для яких у базі записано, що один документ виданий замість іншого; решта — не підтверджена заміна";

  if (c.pairs === null || c.pairs === undefined) {
    host.appendChild(tile("—", "пар, що перетинаються", c.how,
                          "tile--draft"));
    $("conflict-sec").appendChild(note("warn", "Перетини не зміряні: база недоступна."));
    return;
  }

  /* Колір попереджувальний, а не «помилка»: перетин -- це дані, що чекають
     людини, а не збій системи. Нуль пар -- узагалі не попередження. */
  host.appendChild(tile(String(c.pairs), "пар, що перетинаються", c.how,
                        c.pairs ? "tile--draft" : ""));
  host.appendChild(tile(String(c.with_supersession),
                        "з них із записаною підставою заміни",
                        HOW_SUPERSESSION));

  if (!c.pairs) {
    $("conflict-note").textContent = "Перетинів немає.";
    return;
  }

  /* Перелік -- під плиткою, без нового маршруту. Пара показується трьома
     рядками: хто й що саме перетинається, потім два документи. */
  const det = document.createElement("details");
  det.className = "how";
  const sum = document.createElement("summary");
  sum.textContent = "які саме";
  det.appendChild(sum);
  for (const r of c.rows || []) {
    const head = document.createElement("p");
    head.className = "tile-note";
    head.textContent = r.person + " · " + r.kinds;
    det.appendChild(head);
    for (const d of [["a", r.number_a, r.period_a], ["b", r.number_b, r.period_b]]) {
      const p = document.createElement("p");
      p.className = "tile-note";
      p.textContent = "№" + d[1] + " · " + d[2];
      det.appendChild(p);
    }
    if (r.supersession) {
      const s = document.createElement("p");
      s.className = "tile-note";
      s.textContent = "підстава заміни записана";
      det.appendChild(s);
    }
  }
  $("conflict-list").appendChild(det);

  const parts = [];
  if (c.truncated) {
    parts.push("пар без подробиць: " + c.truncated);
  }
  /* Визначення перетину тут БІЛЬШЕ НЕ ПЕРЕКАЗУЄТЬСЯ: воно стоїть під числом,
     а тут стояло вдруге тими самими словами (Аня: «одне й те саме взагалі
     повторюється двічі»). Лишається рівно те, чого визначення не покриває --
     найчастіше хибне прочитання числа. */
  parts.push("різні люди, відсутні одночасно, перетином не є");
  $("conflict-note").textContent = parts.join(". ") + ".";
}

function renderPartner(pm) {
  const host = $("partner-tiles");
  if (!host) { return; }
  host.textContent = "";
  $("partner-note").textContent = "";
  if (!pm) { return; }
  if (pm.error) {
    $("partner-sec").appendChild(note("warn", pm.error));
    return;
  }
  /* Підпис «Міряв Андрій, знаменники тут свої…» ПРИБРАНО (Аня 28.08).
     Хто міряв, лишається видним там, де це перевірне: у полі «чим зміряно»
     під кожним числом стоїть назва приладу й набору. Тобто пояснення не
     зникло, а переїхало до тієї цифри, якої стосується, замість абзацу над
     усім розділом. */
  for (const m of pm.shown || []) { host.appendChild(metricTile(m)); }
  const parts = [];
  if ((pm.folded || []).length) {
    /* Згорнуте НАЗИВАЄТЬСЯ. Це метрики охоплення корпусу: вони є вище
       живими, і показати поруч застарілий знімок означало б покласти на один
       екран два числа про одне й те саме (у пакеті «41 нормативний акт», у
       базі вже 44). */
    parts.push(pm.folded.length + " метрик охоплення не показано окремо: "
               + "ті самі величини є вище, у розділі «База зараз», і там "
               + "вони живі");
  }
  if (pm.dropped) {
    parts.push(pm.dropped + " метрик відкинуто: без поля «чим зміряно» "
               + "цифра не показується");
  }
  $("partner-note").textContent = parts.join(". ");
}

load();
</script>
</body>
</html>

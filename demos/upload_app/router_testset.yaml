# Тест-сет маршрутизації «питання -> очікуваний шаблон каталогу»
# (етап 3 плану docs/tasks/2026-08-24_app-chat-plan.md, задача перед 3.2:
# тест-сет складається ДО вибору encoder-а, щоб вибір був заміром, не смаком).
#
# Формат рядка: q (питання), expected (id шаблону query_catalog.yaml),
# group -- звідки питання:
#   example    -- дослівний приклад із каталогу. Це sanity: приклад мусить
#                 влучати у СВІЙ шаблон. При замірі міряється leave-one-out
#                 (сам приклад виймається з індексу -- він не має відповідати
#                 сам собі)
#   paraphrase -- перефразування, якого в каталозі немає
#   typo       -- одруківки («відпуска», «повертаеться»)
#   colloquial -- розмовні/суржикові форми («скіки», «шо по...»)
#   trap       -- питання-пастка на сусідній шаблон (скільки/хто для того
#                 самого стану; підрозділи; провенанс проти стану особи)
#   smalltalk  -- привітання/подяка/офтоп -> розмовний маршрут
#
# Правило складання: у кожного не-example питання рівно ОДИН захисний
# expected; питань, де два шаблони однаково правильні (сіра зона
# count_by_state_on_date проти absent_breakdown_on_date), у не-example групи
# навмисно не брали -- пастки складені там, де правильна відповідь
# однозначна.
#
# Споживач: demos/upload_app/measure_router.py (замір encoder-ів) і
# подальші прогони приймання. Від бібліотеки роутера файл не залежить.


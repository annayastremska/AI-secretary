# Налаштування генератора синтетичних документів.
# Усе, що змінюється без коду. Після правки — запустити `python generate.py`.

# Номер набору. Той самий номер завжди дає той самий набір документів.
seed: 2026

# За який місяць робимо документи
year: 2026
month: 5

# Умовний номер військової частини — один на весь батальйон.
# У реєстрі номера частини немає, тому він задається тут.
unit_number: А0000

# Місто постійної дислокації. Звідти вибувають у відрядження, туди повертаються.
unit_city: Кропивницький

# Хто підписує документи. З реєстру не береться — причина в ТЗ.md, розділ «Правила заповнення».
# Ім'я умовне, як і номер частини вище. Реальних осіб у наборі немає.
signer:
  rank: підполковник
  name: І. ІВАНЕНКО

# Скільки правильно заповнених документів кожного типу
counts:
  leave_valid: 10
  trip_valid: 10

# Зіпсовані документи — по одній ваді на документ. false вимикає документ із набору.
defects:
  empty_fields: true      # порожні обов'язкові поля: звання, ПІБ, дати
  unknown_person: true    # людина, якої немає в реєстрі
  swapped_dates: true     # кінець раніший за початок
  ocr_noise: true         # О2.05.202б — літери замість цифр

# Пари «документ скасовує документ». Кожна пара — два документи.
pairs:
  leave_interrupted: true   # відпустку перервано, людину відкликали
  trip_reissued: true       # відрядження переоформлене, нові дати
  leave_cancelled: true     # квиток анульований, виписаний новий із тим самим номером

# Куди складати результат і з якою роздільністю робити картинки
output_dir: output
dpi: 200

# Довідники — з них генератор бере значення
leave_types:
  - щорічна основна відпустка за 2026 рік
  - відпустка за сімейними обставинами
  - щорічна додаткова відпустка (за особливий характер служби) за 2026 рік
  - відпустка для лікування після хвороби згідно з висновком ВЛК
  - відпустка у зв’язку з навчанням

cities:
  - м. Львів
  - м. Полтава
  - м. Вінниця
  - м. Черкаси
  - м. Житомир
  - м. Чернівці
  - м. Ужгород
  - м. Рівне
  - м. Суми
  - м. Тернопіль
  - м. Хмельницький
  - м. Івано-Франківськ

trip_purposes:
  - приймання-передача майна служби пального
  - звірка облікових даних особового складу
  - супроводження вантажу та передача автомобільної техніки
  - участь у зборах фахівців фінансових служб
  - проходження курсу підвищення кваліфікації
  - отримання засобів індивідуального захисту
  - технічний нагляд за ремонтом колісної техніки
  - участь у зборах з бойової підготовки

# Куди відряджають. Усі номери умовні — у тому самому стилі, що unit_number вище.
trip_orgs:
  - військова частина А0001
  - військова частина А0002
  - військова частина А0003
  - навчальний центр (в/ч А0004)
  - центральна база зберігання майна (в/ч А0005)
  - навчальний полігон (в/ч А0006)

# Схема шаблону "Посвідчення про відрядження" (Додаток 28 до Інструкції з
# діловодства у ЗСУ, пункт 2.8.8.3). Перевірено проти повного тексту docx.
template: deployment_certificate
domain: deployment
fact_type: deployment_location   # -> dictionaries/fact_type_registry.yaml (validity_model: ranged)

# ПОРОЖНІЙ бланк цієї ж форми, шлях від кореня репозиторію. Той самий файл несе
# ТРИ задачі (відхилення друкованого тексту як значення, межі полів у злитому
# блоці OCR, сигнал «це наша РЕДАКЦІЯ бланка») -- розклад у leave_ticket.yaml і
# в pipeline/extraction/blank_form.py.
blank_template: data/eval/samples/deployment/посвідчення_відрядження.docx

# ВИД СУБ'ЄКТА цього бланка. Оголошення схеми, старше за мапінг
# «домен -> вид» (pipeline/subject_kind.py). person: посвідчення про
# відрядження -- запис про одну конкретну особу, яку відряджають.
# `destination_org` / `unit_to_report` (registry: military_unit) -- це НЕ
# суб'єкт документа, а місце/адресат; вид суб'єкта в документі один.
subject_kind: person

# Як упізнати саме цей бланк -- щоб схему вибирав пайплайн, а не людина
# вручну (див. pipeline/identification.py). Усі фрази взяті з реального
# OCR-виводу заповненого документа, не вигадані.
identification:
  description: "Посвідчення про відрядження (Додаток 28 до Інструкції з діловодства у ЗСУ)"
  title: ["посвідчення про відрядження"]        # вага 5
  anchors:                                      # вага 2 кожен
    - "додаток 28"
    - "термін відрядження"
    - "підстава відрядження"
    - "пункти призначень"
    - "мета відрядження"
  min_score: 5

fields:
  # --- rank + ПІБ: той самий generic-режим, що й у leave_ticket ---
  # ВИПРАВЛЕНО (знайдено локальним regression-тестом): на цьому бланку "Видано"
  # надруковане в ТОМУ САМОМУ рядку, що й значення ("Видано  рядовий ПРІЗВИЩЕ
  # Ім'я По-батькові") -- на відміну від leave_ticket, де рядок звання+ПІБ був
  # самостійним. Без strip_prefix токенізація зсувалась: "Видано"/"рядовий"
  # потрапляли в given_name/patronymic замість самого імені.
  - name: rank
    # part: РОЛЬ поля в розборі рядка "звання ПІБ". Саме вона, а не ім'я
    # поля, керує морфологією й ключем у subject -- тому схема може
    # називати поля як завгодно (applicant_surname, prizvyshche).
    part: rank
    type: category
    category: military_rank
    extraction: rank_and_name_tokenized
    label_before: "військове звання, прізвище"
    strip_prefix: "Видано"
    db_target: person

  - name: surname
    # `normalization:` тут БУЛО й ПРИБРАНО 22.08.2026 (рев'ю, A-04):
    # `nominative_case` на цьому полі не читався жодним рядком коду --
    # `extraction: rank_and_name_tokenized` іде власною гілкою build_record,
    # де морфологію вибирає `part:`. Заміряно: видалення ключа й підміна його
    # іншим значенням давали ПОБАЙТОВО той самий вихід. Мертвий ключ тут
    # небезпечніший за звичайне сміття, бо читається як гарантія: наступний
    # автор схеми вважав би, що знявши його, вимкне морфологію.
    # Тепер оголошення -- error валідатора.
    # part: РОЛЬ поля в розборі рядка "звання ПІБ". Саме вона, а не ім'я
    # поля, керує морфологією й ключем у subject -- тому схема може
    # називати поля як завгодно (applicant_surname, prizvyshche).
    part: surname
    type: text
    extraction: rank_and_name_tokenized
    strip_prefix: "Видано"
    db_target: person

  - name: given_name
    # part: РОЛЬ поля в розборі рядка "звання ПІБ". Саме вона, а не ім'я
    # поля, керує морфологією й ключем у subject -- тому схема може
    # називати поля як завгодно (applicant_surname, prizvyshche).
    part: given_name
    type: text
    extraction: rank_and_name_tokenized
    strip_prefix: "Видано"
    db_target: person

  - name: patronymic
    # part: РОЛЬ поля в розборі рядка "звання ПІБ". Саме вона, а не ім'я
    # поля, керує морфологією й ключем у subject -- тому схема може
    # називати поля як завгодно (applicant_surname, prizvyshche).
    part: patronymic
    type: text
    extraction: rank_and_name_tokenized
    strip_prefix: "Видано"
    db_target: person

  - name: position_and_workplace
    type: text
    # dimension: поле стає ОКРЕМИМ рядком у facts БД-споживача -- тобто
    # значенням, за яким можна ЗАПИТАТИ (GROUP BY, WHERE), а не лише
    # прочитати очима.
    # ВИПРАВЛЕНО 22.08.2026 (рев'ю, A-03): тут стояло «additional_info
    # завантажувач не читає, до бази не доходить узагалі (у facts немає
    # JSON-колонки)» -- це СТАЛЕ вже щонайменше з міграції
    # 8a667569ba4d_facts_additional_info_jsonb: колонка `facts.additional_info
    # JSONB` існує, і завантажувач її пише (ai_secretary_loader.py:497 ->
    # Jsonb(additional_info)). Тобто вибір між `dimension:` і
    # `additional_info` -- це вибір «окремий рядок, за яким можна запитати»
    # проти «поле в JSON, яке видно, але за яким не запитаєш», а не
    # «доходить» проти «не доходить».
    dimension: position
    # ВИПРАВЛЕНО 13.08.2026. Тут стояв `extraction: llm` з коментарем "без
    # лейбл-якоря" -- це було неправильно: на бланку значення стоїть блоком
    # ПЕРЕД лейблом "(посада, місце роботи)", як і решта полів цього типу
    # (перевірено на TRIP-001: блок 20 -- значення, блок 21 -- лейбл).
    # Ціна помилки була не в точності, а в часі: це поле лишалось ЄДИНИМ
    # llm-полем шаблону, тому кожен з 14 документів платив повний LLM-виклик
    # (увесь текст документа в промпт, ~85% часу виклику -- prefill) за одне
    # НЕКРИТИЧНЕ вільнотекстове поле.
    # Якір лишається корисним і в разі провалу: тоді прогалина стає
    # ЛОКАЛІЗОВАНОЮ, і в модель іде один рядок замість усього документа.
    extraction: block_before_label
    label_before: "посада, місце роботи"
    note: "Поле під заголовком «(посада, місце роботи)» — не розділене на бланку."
    db_target: additional_info

  # ВИПРАВЛЕНО за синтетичним набором (13.08.2026). Тут стояв `extraction: llm`
  # -- тобто поле ОСНОВНОГО факту («де людина») не витягувалось без моделі ЗА
  # ПОБУДОВОЮ, і всі 14 документів корпусу висіли в needs_review з
  # `confirmed: 0 з 14`. Насправді на бланку це окреме поле з лейблом:
  # значення стоїть у власному блоці ПЕРЕД друкованою приміткою
  # "(пункти призначень)", рівно той самий патерн, що вже працює для
  # destination_org. Заміряно: block_before_label дає 14/14 правильних значень
  # на docx і на pdf.
  # strip_prefix: на бланку перед значенням надруковано "відрядженому до" /
  # "відрядженій до" -- форма ЗА СТАТТЮ. Зрізання розпізнає обидві словоформи
  # (extract.prefix_match_length), як і "звільнений"/"звільнена" в
  # leave_ticket.
  - name: destination_points
    type: text
    # value_free_text: пункти призначень -- вільний текст за побудовою (може
    # бути кілька пунктів в одному рядку), контрольованого довідника
    # населених пунктів у нас немає. Оголошено явно за тією самою логікою, що
    # в leave_ticket (рев'ю 22.08.2026, A-11).
    value_free_text: true
    extraction: block_before_label
    label_before: "пункти призначень"
    strip_prefix: "відрядженому до"
    note: "Поле «(пункти призначень)» — можливо кілька пунктів в одному рядку."
    db_target: fact_value

  - name: destination_org
    type: object_ref
    # dimension: поле стає ОКРЕМИМ рядком у facts БД-споживача -- тобто
    # значенням, за яким можна ЗАПИТАТИ (GROUP BY, WHERE), а не лише
    # прочитати очима.
    # ВИПРАВЛЕНО 22.08.2026 (рев'ю, A-03): тут стояло «additional_info
    # завантажувач не читає, до бази не доходить узагалі (у facts немає
    # JSON-колонки)» -- це СТАЛЕ вже щонайменше з міграції
    # 8a667569ba4d_facts_additional_info_jsonb: колонка `facts.additional_info
    # JSONB` існує, і завантажувач її пише (ai_secretary_loader.py:497 ->
    # Jsonb(additional_info)). Тобто вибір між `dimension:` і
    # `additional_info` -- це вибір «окремий рядок, за яким можна запитати»
    # проти «поле в JSON, яке видно, але за яким не запитаєш», а не
    # «доходить» проти «не доходить».
    dimension: deployment_org
    registry: military_unit
    extraction: block_before_label
    label_before: "найменування військової частини, установи, організації"
    db_target: additional_info

  - name: deployment_days
    type: number
    # Межі правдоподібності ЦЬОГО поля (днів): захист від захопленого
    # OCR-шуму (номер документа, рік) на regex-провалі. Раніше 366 було
    # константою коду в генеричному типі number (R-A1-03).
    min_value: 1
    max_value: 366
    # dimension: поле стає ОКРЕМИМ рядком у facts БД-споживача -- тобто
    # значенням, за яким можна ЗАПИТАТИ (GROUP BY, WHERE), а не лише
    # прочитати очима.
    # ВИПРАВЛЕНО 22.08.2026 (рев'ю, A-03): тут стояло «additional_info
    # завантажувач не читає, до бази не доходить узагалі (у facts немає
    # JSON-колонки)» -- це СТАЛЕ вже щонайменше з міграції
    # 8a667569ba4d_facts_additional_info_jsonb: колонка `facts.additional_info
    # JSONB` існує, і завантажувач її пише (ai_secretary_loader.py:497 ->
    # Jsonb(additional_info)). Тобто вибір між `dimension:` і
    # `additional_info` -- це вибір «окремий рядок, за яким можна запитати»
    # проти «поле в JSON, яке видно, але за яким не запитаєш», а не
    # «доходить» проти «не доходить».
    dimension: deployment_days
    extraction: regex
    regex_variants:
      - pattern: 'відрядження\s*[«"“„]?(?P<value>\d+)[»"”‟]?\s*днів'
    # Той самий клас, що duration_days у leave_ticket: кількість днів
    # визначається діапазоном включно з обома кінцями (14/14 у наборі, разом
    # із TRIP-011, де дати переставлені -- 3 дні між 22 і 20).
    consistency:
      rule: days_span_inclusive
      start: deployment_start_date
      end: deployment_end_date
    db_target: additional_info

  - name: deployment_start_date
    type: date
    extraction: regex
    regex_variants:
      # окремий рік при кожній даті -- підтверджено за реальним текстом docx,
      # тут це основний варіант, не запасний (на відміну від leave_ticket)
      - pattern: 'з\s*[«"“„]?(?P<day>\d{1,2})[»"”‟]?\s+(?P<month>\d{1,2}|[а-яіїє]+)\s+20(?P<year>\d{2})\s*(?:р\.?|рок\w*)'
    db_target: fact_date_start

  - name: deployment_end_date
    type: date
    extraction: regex
    regex_variants:
      - pattern: 'по\s*[«"“„]?(?P<day>\d{1,2})[»"”‟]?\s+(?P<month>\d{1,2}|[а-яіїє]+)\s+20(?P<year>\d{2})\s*(?:р\.?|рок\w*)'
    db_target: fact_date_end

  # ВИПРАВЛЕНО за синтетичним набором (13.08.2026), та сама причина, що й у
  # destination_points: «мета відрядження» -- вільний текст, але НЕ безлейблове
  # поле. Значення стоїть перед друкованою приміткою "(мета відрядження)", і
  # block_before_label дає 14/14 на docx і на pdf.
  # value_starts_after: у PDF PyMuPDF складає в один блок рядок терміну
  # відрядження ("Термін відрядження “2” днів   з ... по ... р.") РАЗОМ із
  # метою, а дужкової примітки між ними на бланку немає -- без цієї межі
  # чужий рядок приклеювався до значення (див.
  # extract.compile_value_boundaries).
  - name: purpose
    type: text
    # dimension: поле стає ОКРЕМИМ рядком у facts БД-споживача -- тобто
    # значенням, за яким можна ЗАПИТАТИ (GROUP BY, WHERE), а не лише
    # прочитати очима.
    # ВИПРАВЛЕНО 22.08.2026 (рев'ю, A-03): тут стояло «additional_info
    # завантажувач не читає, до бази не доходить узагалі (у facts немає
    # JSON-колонки)» -- це СТАЛЕ вже щонайменше з міграції
    # 8a667569ba4d_facts_additional_info_jsonb: колонка `facts.additional_info
    # JSONB` існує, і завантажувач її пише (ai_secretary_loader.py:497 ->
    # Jsonb(additional_info)). Тобто вибір між `dimension:` і
    # `additional_info` -- це вибір «окремий рядок, за яким можна запитати»
    # проти «поле в JSON, яке видно, але за яким не запитаєш», а не
    # «доходить» проти «не доходить».
    dimension: deployment_purpose
    extraction: block_before_label
    label_before: "мета відрядження"
    value_starts_after:
      - 'Термін\s+відрядження'
    db_target: additional_info

  - name: basis_order_date
    type: date
    # dimension: поле стає ОКРЕМИМ рядком у facts БД-споживача -- тобто
    # значенням, за яким можна ЗАПИТАТИ (GROUP BY, WHERE), а не лише
    # прочитати очима.
    # ВИПРАВЛЕНО 22.08.2026 (рев'ю, A-03): тут стояло «additional_info
    # завантажувач не читає, до бази не доходить узагалі (у facts немає
    # JSON-колонки)» -- це СТАЛЕ вже щонайменше з міграції
    # 8a667569ba4d_facts_additional_info_jsonb: колонка `facts.additional_info
    # JSONB` існує, і завантажувач її пише (ai_secretary_loader.py:497 ->
    # Jsonb(additional_info)). Тобто вибір між `dimension:` і
    # `additional_info` -- це вибір «окремий рядок, за яким можна запитати»
    # проти «поле в JSON, яке видно, але за яким не запитаєш», а не
    # «доходить» проти «не доходить».
    dimension: order_date
    extraction: regex
    note: >
      «Підстава відрядження: рішення, наказ від ___ №___» — єдине
      ідентифікуюче посилання на цьому бланку (власного номера/дати
      документа тут немає).
    # ВИПРАВЛЕНО 13.08.2026: патерн вимагав літерально "наказ від", а бланк
    # друкує "наказ КОМАНДИРА ВІЙСЬКОВОЇ ЧАСТИНИ А0000 від 19.05.2026 № 345"
    # -- тобто не збігався НІКОЛИ, і поле давало 0/14 на обох корпусах. Це
    # було невидимо, бо `basis_order_date` немає в eval/field-mapping.yaml,
    # а поле має `dimension:`, тобто йде в БД ОКРЕМИМ фактом: у facts мовчки
    # не було жодної дати наказу-підстави.
    # `[^№]*?` -- ліниво й БЕЗ переходу через "№": так проміжок між "наказ" і
    # "від" не може дотягтися до дати наступного поля.
    regex_variants:
      - pattern: 'наказ[^№]*?від\s*(?P<day>\d{1,2})[.\s]+(?P<month>\d{1,2})[.\s]+(?P<year>\d{4})'
    db_target: additional_info

  - name: basis_order_number
    type: text
    # dimension: поле стає ОКРЕМИМ рядком у facts БД-споживача -- тобто
    # значенням, за яким можна ЗАПИТАТИ (GROUP BY, WHERE), а не лише
    # прочитати очима.
    # ВИПРАВЛЕНО 22.08.2026 (рев'ю, A-03): тут стояло «additional_info
    # завантажувач не читає, до бази не доходить узагалі (у facts немає
    # JSON-колонки)» -- це СТАЛЕ вже щонайменше з міграції
    # 8a667569ba4d_facts_additional_info_jsonb: колонка `facts.additional_info
    # JSONB` існує, і завантажувач її пише (ai_secretary_loader.py:497 ->
    # Jsonb(additional_info)). Тобто вибір між `dimension:` і
    # `additional_info` -- це вибір «окремий рядок, за яким можна запитати»
    # проти «поле в JSON, яке видно, але за яким не запитаєш», а не
    # «доходить» проти «не доходить».
    dimension: order_number
    extraction: regex
    # ВИПРАВЛЕНО 13.08.2026 разом із basis_order_date: та сама вимога
    # літерального "наказ від", те саме 0/14, та сама невидимість.
    regex_variants:
      - pattern: 'наказ[^№]*№\s*(?P<value>\S+)'
    db_target: additional_info

  # --- Зв'язок документ -> документ (скасовує/змінює) ---
  # Обґрунтування й межі -- у schemas/leave_ticket.yaml, поле
  # supersedes_document_number. Тут надруковано "(переоформлено замість
  # посвідчення № 254)" (TRIP-014), тобто номер є.
  - name: supersedes_document_number
    type: text
    extraction: regex
    link_type: supersedes
    llm_fallback: false
    regex_variants:
      - pattern: 'замість\s+посвідчення\s*№\s*(?P<value>[\w/\-]+)'
    db_target: additional_info

  - name: supersession_note
    type: text
    extraction: regex
    link_type: supersedes
    llm_fallback: false
    # ВИПРАВЛЕНО 22.08.2026 (рев'ю, C-02) -- те саме, що в leave_ticket:
    # позначка мусить стояти В ДУЖКАХ і бути окремим словом, інакше згадка
    # "порядок анульовання" у суцільному тексті давала supersedes при
    # confirmed=True. Обґрунтування повністю -- schemas/leave_ticket.yaml,
    # поле supersession_note.
    regex_variants:
      - pattern: '\((?P<value>[^()]{0,120}?\b(?:переоформлено|анульован\w*|скасован\w*)\b[^()]{0,120}?)\)'
    db_target: additional_info

  # --- Реєстр об'єктів, не довідник значень ---
  - name: authorizing_commander
    type: object_ref
    registry: person
    priority: deferred
    note: "Підпис командира (начальника штабу) на лицьовій стороні. Відкладено, як у leave_ticket."
    db_target: additional_info

  # ДОДАНО 23.08.2026 (weak-spots 10.2). На відпускному квитку фактичне
  # повернення -- окреме поле бланка (`actual_return_date`), а на посвідченні
  # воно живе у таблиці відміток на зворотному боці, і не витягувалось ЗОВСІМ.
  # Наслідок: дострокове повернення з відрядження системі невидиме -- особа
  # рахується «у відрядженні» до планової дати, хоч у документі стоїть
  # відмітка про прибуття раніше.
  #
  # Правило: остання ЗАПОВНЕНА відмітка «Прибув до ...» -- це повернення.
  # Порожні рядки таблиці патерн не ловить (у них замість місця підкреслення,
  # замість дати -- «“____” ____ 20____»), тому «останній збіг» і означає
  # «остання реальна зупинка», а не «четвертий рядок бланка».
  #
  # `multiple_matches: last` оголошено ПОЛЕМ навмисно: за замовчуванням кілька
  # різних збігів -- це неоднозначність (C-03), і тихо змінювати це правило для
  # всіх було б поверненням того класу помилки. Тут повторення -- властивість
  # бланка, а не суперечність.
  - name: actual_return_date
    type: date
    dimension: deployment_actual_return
    extraction: regex
    multiple_matches: last
    regex_variants:
      - pattern: 'Прибу\w+\s+до\s+(?!_)[^\n]+\n\s*[«"“„]?(?P<day>\d{1,2})[»"”‟]?\s+(?P<month>\d{1,2}|[а-яіїє]+)\s+20(?P<year>\d{2})'
    db_target: additional_info

  - name: stops
    type: object_ref
    registry: none
    multiple: true
    priority: deferred
    note: >
      Зворотний бік — фіксована таблиця максимум на 4 зупинки, кожна
      «Вибув із .../Прибув до ...»; «забезпечувався триразовим харчуванням»
      є лише з 2-ї по 4-у зупинку. Один документ може дати кілька фактів
      місцезнаходження — складніше за leave, відкладено до реального
      прогону з кількома заповненими зупинками.
    db_target: additional_info

  # ВИПРАВЛЕНО за синтетичним набором (11.08.2026). Раніше тут стояв
  # priority: deferred з коментарем "реального номера в бланку немає" -- це
  # висновок з ПОРОЖНЬОГО шаблону, де номер не надрукований. У заповнених
  # документах номер і дата видачі стоять ОДНИМ рядком: "№ 201    від
  # 20.05.2026". Обидва regex прив'язані до "від <дата>", тому вони не можуть
  # злапати "Додаток 28" -- саме через цей ризик поле й було відкладене.
  - name: document_number
    type: text
    extraction: regex
    dimension: document_number
    regex_variants:
      - pattern: '№\s*(?P<value>[\w/\-]+)\s+від\s+\d{1,2}\.\d{1,2}\.\d{4}'
    db_target: additional_info

  - name: document_date
    type: date
    extraction: regex
    dimension: document_date
    regex_variants:
      - pattern: '№\s*[\w/\-]+\s+від\s+(?P<day>\d{1,2})\.(?P<month>\d{1,2})\.(?P<year>\d{4})'
    db_target: additional_info

# Довідник для цього шаблону не потрібен додатковий: єдине категоріальне
# поле — rank, і military_rank уже існує. "мета"/"підстава" — вільний текст.
out_of_scope: []
